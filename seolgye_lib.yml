# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# AI점자도서관 아이폰 설계도. 이 앱의 판 번호(MARKETING_VERSION)와 설정은 이 파일에서만 고칩니다.
# 짓기: build.yml 이 eoneu 에 맞춰 이 파일만 씀(xcodegen generate --spec seolgye_lib.yml)
name: AdaApp
include:
  - seolgye_gongtong.yml
targets:
  LibApp:
    # 0.2.0 (261002-1/261003-1) 디자인 바탕(남색·금빛, 법인 로고, 표지)·내 서재 새로(15권씩, 지우기·되돌리기, 다 읽은 책)
    # 0.1.0 (260930-6) AI점자도서관 앱 — 도서관, 내 서재, 설정·도움말 세 탭과 독서기
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lib
    info:
      path: Lib/Info.plist
      properties:
        CFBundleDisplayName: AI점자도서관
        CFBundleName: LibApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.lib
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.8.4"   # 261019-L23 게시판 — 공지·묻고 답하기·후기·제작 요청·불편 신고, 도서관 첫 화면에서 들어감, 도움말 넷(도클, 대표님 승인 2026-10-19 「그래」). 261019-L22 회원 등급 — 설정에 내 회원 등급, 장애 확인하기(복지카드·장애인증명서 사진 올리기), 잠긴 책을 열면 알리고 장애 확인하기 단추, 도움말 「회원 등급」(도클, 이사장님 승인 2026-10-19 11시 50분 「1」). 261019-L21 이용 장부(책 열기·1분마다 들은 시간·끝까지 들음), 회원 정보 여쭙기(장애 유형·지역·연령대·약관 동의), 13곡째쯤 곡 중간에 멈추던 것 바로잡음(지킴이 떼기·6초 멈추면 다시 이어 틀기·두 번 받지 않기), 도움말 셋(이사장님 승인 2026-10-18 23시 49분 「1」). 261018-L20 곡이 넘어갈 때 제목 읽기 켜기·끄기를 듣는 화면에서 설정으로 옮김(이사장님 승인 「3」). 261018-L19 엔터테인먼트 이어 듣기·이어 보기 — 곡·회가 끝나면 다음 것 저절로(서버 enter.php m=daeum), 듣는 방식 다섯(앨범·작품 끝까지, 갈래 전체, 섞어 듣기, 한 곡 반복, 한 곡만), 앞 곡·다음 곡 단추와 이어폰·잠금 화면 다음 곡, 넘어갈 때 이름 한 번 알림, 다음 곡 미리 받기, 도움말 「음악·드라마 이어 듣기」(도클, 이사장님 지시 2026-10-18 12시 47분·승인 「1」). 261016-L18 엔터테인먼트 여덟 갈래 모두 열림·영상 작품은 화면과 함께(서버가 영상인지 알려 줌), 첫 화면 제목 「갈래」, 도움말 「영상 보기」(도클, 이사장님 승인 2026-10-16 2시 21분 「1」). 261014-L17 탭을 고르면 커서를 목록 첫 줄에(길눈처럼), 책 듣기 멈춤 줄이기 — 미리 받기를 세 문단 차례로·지금 문단 먼저·묻기 줄이기·멀어진 미리 받기 그만둠, 도움말 「탭 고르기」(도서관 창 클, 이사장님 지시 23시 4분·승인 23시 17분 「1」). 261014-L16 엔터테인먼트 탭(나스 AI문화관의 공개 갈래 — 첫 갈래 화면해설 작품, 이어 듣기·찾기·도움말 — 도서관 창 클, 이사장님 승인 「1」·「2」). 261014-L15 기다림 알리기(10초·45초 한 번씩, 4분까지 기다림), 이용 기록(앱 판·막힌 일을 협회 서버에, 이름·전화·책은 남기지 않음 — 도서관 창 클, 이사장님 승인 「1」·「그래」, 도움말·등록 화면 알림). 261012-L14 사전 도움말에 우리말샘·한국고전종합DB, 한자음 읽기 도움말에 경서 읽는 소리(도서관 창 클, 이사장님 승인 「1」). 261012-L13 한자음 읽기(중국 고전을 우리 한자음으로, 간체자도, 원문 함께 보기 — 도서관 창 클, 이사장님 승인 「1」). 261012-L12 곱씹어 읽기(다시 듣기·풀어 읽기·중요 표시·책 속 찾기)와 사전·내 낱말장(도서관 창 클, 이사장님 승인 「1」). 261012-L11 외국 도서 문(외국 도서 → 언어 → 장르와 주제), 글 판 4(강제 줄바꿈 바로잡은 글·옛 자리 옮기기), 도움말 둘(도서관 창 클, 이사장님 승인 「1」). 261010-L10 첫 화면 맨 위 이름 줄·바로 아래 찾기 칸, 목록에서 한 번 두드리면 바로 읽기, 넘긴 뒤 커서를 첫 줄로(도서관 창 클, 이사장님 승인 「1」). 261010-L9 첫 화면에 고른 문의 서가 목록·형태별 갈래와 보일 책 뺌·세 손가락 쓸기로 목록 넘기기(도서관 창 클, 이사장님 승인 「1」). 261007-L7 새 판 알림(대장클, 이사장님 지시). 261006-6 책 소개·지은이·출판사, 책 소개 듣기. 261006-5 여섯 문단 미리 받기(소리 멈춤 줄이기). 261006-4 목소리 열 가지·미리 듣기, 재생 위치 막대, 앞으로 30초와 뒤로 30초(이사장님 지시). 261006-3 인터넷이 될 때는 늘 도서관(서버) 목소리, 폰 목소리는 인터넷이 끊겼을 때만(이사장님 지적). 261006-2 세 겹의 문 목록 고침·탭 고르면 맨 위로·독서기 떠나면 멈춤(도서관 창 클, 이사장님 지적)
schemes:
  LibApp:
    build:
      targets:
        LibApp: all
    archive:
      config: Release
