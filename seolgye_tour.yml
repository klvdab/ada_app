# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# LVD투어스튜디오 아이폰 설계도. 이 앱의 판 번호(MARKETING_VERSION)와 설정은 이 파일에서만 고칩니다.
# 짓기: build.yml 이 eoneu 에 맞춰 이 파일만 씀(xcodegen generate --spec seolgye_tour.yml)
name: AdaApp
include:
  - seolgye_gongtong.yml
targets:
  TourApp:
    # 1.0.0 (261012-T1, 2026-10-12 이사장님 승인 「1」) LVD투어스튜디오 — 웹 투어스튜디오 1.12판을 속까지 앱으로(Tour 폴더), iOS 17 이상
    # 탭 다섯: 코스·답사·지점·현장영상해설·설정. 서버는 웹과 같은 lvdts_api.php
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tour
    info:
      path: Tour/Info.plist
      properties:
        CFBundleDisplayName: 투어스튜디오
        CFBundleName: TourApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: 답사 때 지점의 정지 현장영상해설 자리에서 시계 방향 네 쪽 사진을 찍는 데 카메라를 씁니다.
        NSLocationWhenInUseUsageDescription: 답사 때 지점이 시작되고 끝나는 자리와 지점 사이 걸은 거리(이동 시간)를 적는 데 위치를 씁니다.
        NSMicrophoneUsageDescription: 답사 때 현장 메모를 말로 적고, 대본을 읽으며 연습 녹음을 하는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 적은 현장 메모와 연습 녹음을 글로 옮기고, 말하는 대로 대본을 쓰는 데 받아쓰기를 씁니다.
        NSPhotoLibraryAddUsageDescription: 답사 사진을 사진 앱에 저장하는 데 씁니다.
        NSMotionUsageDescription: 답사 때 지점 사이를 걸으며 걸음 수와 계단·오르막을 재어 이동 구간 안내 초안을 쓰는 데 동작과 기압 센서를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.tourstudio
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.4.0"   # 261018-T6 말로 대본 쓰기(받아쓰기를 바로 대본으로), 이어폰 한 번 누름을 대본 받아쓰기로(방클, 이사장님 「1」). 1.3.0 261018-T5 앱만 할 수 있는 것 — 이어폰 단추로 답사, 걸으며 저절로 재기, 판 기록(방클, 이사장님 승인 1·2·8번). 1.2.0 261017-T4 웹에 있는 기능 모두 — 관리자 일·내보내기·협회 승인·원칙 16개·평면도·답사 지도·사전·장소 지식·승인본 현장영상해설 화면·저절로 찍기·벗어남 알림(방클, 이사장님 지시 「웹에 있는 모든 기능을 겉과 속이 같게」). 1.1.0 261017-T3 웹에 있던 것 열네 가지 — 사진 크게 보기·지우기·다시 찍기, 지점 지우기, 현장 메모(말·글)와 듣기, 읽으며 녹음과 되돌아보기(mp3), 못 올린 것 다시 올리기, 봐 달라고 알리기, 판 되돌리기, 코스 지우기·휴지통, 더 적을 것(방클, 이사장님 승인 「첫단계부터 시작해」). 261014-T2 사진 안내 시계 방향·네 개씩 목록 「넷」·도움말 뒤로 단추 자리(이사장님 승인 「1」). 261012-T1 첫 판 — 코스·답사(지점 경계·새 지점·시계 방향 사진)·지점 한 화면·현장영상해설·원칙 16개 점검·승인 요청·저절로 저장(이사장님 승인 「1」)
schemes:
  TourApp:
    build:
      targets:
        TourApp: all
    archive:
      config: Release
