# 도서관 앱 가상 폰 자동 시험 (판 0.2.0, 빌드 261007-2, 도서관 창 클)
# 0.2.0: 깃허브 안의 전수 시험 대본(.github/sihum/lib_dolgi.py)으로 화면마다 글자를 다 받아 적고 단추를 눌러 가며 살핌.
name: lib-gasang
on:
  workflow_dispatch:
jobs:
  gasang:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 시험판 받기
        run: |
          curl -sL -o lib.apk "https://raw.githubusercontent.com/${{ github.repository }}/sihum-apk-lib/lib.apk"
          ls -la lib.apk
      - name: 가상 폰에서 전수 시험
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash -c 'adb install -r lib.apk; adb shell settings put secure enabled_accessibility_services none; python3 .github/sihum/lib_dolgi.py; cp gyeolgwa/jeonsu.txt gyeolgwa/lib_jeonsu_sihum.txt; curl -s -A "curl/8.5.0 lvd-seobeo" -F "f=@gyeolgwa/lib_jeonsu_sihum.txt" "https://lvd.ada.or.kr/seobeo/bat.php?k=sb260924mk&a=put"; true'
      - name: 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-gasang-gyeolgwa
          path: gyeolgwa
