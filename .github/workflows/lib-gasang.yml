# 도서관 앱 가상 폰 자동 시험 (판 0.2.1, 빌드 261008-1, 도서관 창 클)
# 0.2.1: 가상 폰 소리 장치 켬(-noaudio 뺌) — 소리가 실제로 나가야 독서기 문단이 넘어가는지 볼 수 있음
# 0.2.0: 화면 하나하나 눌러 보기(.github/sihum/lib_hwamyeon.py) — 세 문, 찾기, 책 정보, 읽기, 앞으로 30초, 화면 끈 뒤 소리, 내 서재, 설정, 목소리 미리 듣기, 도움말
name: lib-gasang
on:
  workflow_dispatch:
jobs:
  gasang:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 시험판 받기
        run: |
          curl -sL -o lib.apk "https://raw.githubusercontent.com/${{ github.repository }}/sihum-apk-lib/lib.apk"
          ls -la lib.apk
      - name: 가상 폰에서 하나하나 눌러 보기
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: adb install -r lib.apk && python3 .github/sihum/lib_hwamyeon.py; cat g/gyeolgwa.txt; true
      - name: 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-gasang-gyeolgwa
          path: g
