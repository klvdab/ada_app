# 올림 얹기 (1.2판, 261021-OE3 — 바뀐 파일들만 맞대 봄(다른 클이 그사이 main에 올려도 됨). 워크플로 파일은 이 방법으로 못 바꾸므로 미리 웹으로 올림, 방클, 이사장님 승인 2026-10-21 「그래」)
# olim-data 갈래에 받아 둔 묶음(git bundle)의 커밋을 main에 얹습니다. 바뀐 파일들의 값이 미리 맞춰 본 값과 다르면 멈춥니다.
name: olim-eotgi
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "olim-data 갈래의 묶음 파일 이름"
        required: true
      commits:
        description: "얹을 커밋들(빈칸으로 나눔)"
        required: true
      tree:
        description: "얹은 뒤 바뀐 파일들의 값(git ls-tree -r HEAD -- 바뀐 파일 | sha1sum)"
        required: true
permissions:
  contents: write
jobs:
  eotgi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 묶음 커밋 얹기
        env:
          BUNDLE: ${{ inputs.bundle }}
          COMMITS: ${{ inputs.commits }}
          TREE: ${{ inputs.tree }}
        run: |
          case "$BUNDLE" in */*|..*|"") echo "파일 이름만 적어 주십시오"; exit 1 ;; esac
          git fetch -q origin +olim-data:refs/remotes/origin/olim-data
          git show "origin/olim-data:$BUNDLE" > /tmp/b.bundle
          git fetch -q /tmp/b.bundle 'refs/heads/*:refs/remotes/bundle/*'
          O=$(git rev-parse HEAD)
          git -c user.name=olim-eotgi -c user.email=noreply@ada.or.kr cherry-pick -X ours $COMMITS
          git diff --name-only $O HEAD
          T=$(git ls-tree -r HEAD -- $(git diff --name-only $O HEAD) | sha1sum | cut -c1-40)
          echo "나온 값 $T / 기대 $TREE"
          [ "$T" = "$TREE" ] || exit 1
          git push origin HEAD:main
