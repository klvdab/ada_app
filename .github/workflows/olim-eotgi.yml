# 올림 얹기 (1.0판, 261021-OE1, 방클, 이사장님 승인 2026-10-21 「그래」)
# olim-data 갈래에 받아 둔 묶음(git bundle)의 커밋을 main에 얹습니다. 결과 트리가 미리 맞춰 본 값과 다르면 멈춥니다.
name: olim-eotgi
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "olim-data 갈래의 묶음 파일 이름"
        required: true
      commits:
        description: "얹을 커밋들(빈칸으로 나눔)"
        required: true
      tree:
        description: "얹은 뒤 나와야 할 트리 값"
        required: true
permissions:
  contents: write
jobs:
  eotgi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 묶음 커밋 얹기
        env:
          BUNDLE: ${{ inputs.bundle }}
          COMMITS: ${{ inputs.commits }}
          TREE: ${{ inputs.tree }}
        run: |
          case "$BUNDLE" in */*|..*|"") echo "파일 이름만 적어 주십시오"; exit 1 ;; esac
          git fetch -q origin +olim-data:refs/remotes/origin/olim-data
          git show "origin/olim-data:$BUNDLE" > /tmp/b.bundle
          git fetch -q /tmp/b.bundle 'refs/heads/*:refs/remotes/bundle/*'
          git -c user.name=olim-eotgi -c user.email=noreply@ada.or.kr cherry-pick -X ours $COMMITS
          T=$(git rev-parse 'HEAD^{tree}')
          echo "나온 트리 $T / 기대 $TREE"
          [ "$T" = "$TREE" ] || exit 1
          git push origin HEAD:main
