# 협회 앱·자봉 앱·배프 앱 자동 짓기·올리기 (1.0.3판, 빌드 260923-5)
# 깃허브가 빌려 주는 맥에서 Xcode 26 으로 프로젝트를 만들고, 앱스토어 커넥트 열쇠(관리자 권한)로 서명해 올립니다.
# 필요한 비밀값은 ★하나뿐입니다 (Settings → Secrets and variables → Actions):
#   ASC_BUNDLE   아래 네 가지를 한 덩이로 넣습니다.
#     KEY_ID=열쇠ID(열 자리)
#     ISSUER_ID=발급자ID
#     TEAM_ID=팀ID(열 자리)
#     -----BEGIN PRIVATE KEY----- 부터 -----END PRIVATE KEY----- 까지 p8 파일 내용 그대로
# 짓기는 Actions 화면의 「Run workflow」로 손수 돌립니다.
#   eoneu   ada = 협회 앱(애플워치 포함) / jabong = 자봉 앱 / bfb = 배프 앱
#   ollida  true = 앱스토어 커넥트에 올리기 / false = 짓기만 하고 파일로 남기기
name: app-jitgi
on:
  workflow_dispatch:
    inputs:
      eoneu:
        description: "어느 앱 (ada = 협회 앱, jabong = 자봉 앱, bfb = 배프 앱)"
        default: "ada"
      ollida:
        description: "앱스토어 커넥트에 올리기 (true/false)"
        default: "true"
jobs:
  jitgi:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 어느 앱인지 정하기
        env:
          EONEU: ${{ github.event.inputs.eoneu || 'ada' }}
        run: |
          case "$EONEU" in
            jabong) SCH=JabongApp; NM=자봉앱 ;;
            bfb)    SCH=BfbApp;    NM=배프앱 ;;
            ada|"") SCH=AdaApp;    NM=협회앱 ;;
            *) echo "eoneu 는 ada, jabong, bfb 중 하나여야 합니다 (받은 값: $EONEU)"; exit 1 ;;
          esac
          echo "SCHEME=$SCH" >> "$GITHUB_ENV"
          echo "APPNAME=$NM" >> "$GITHUB_ENV"
          echo "짓는 앱: $NM (스킴 $SCH)"

      - name: Xcode 26 고르기
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then echo "Xcode 26 이 없습니다"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: 도구 준비
        run: |
          brew install xcodegen
          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet pillow

      - name: 아이콘 만들기
        run: /tmp/py/bin/python tools/make_icon.py

      - name: 열쇠 풀어 놓기
        env:
          ASC_BUNDLE: ${{ secrets.ASC_BUNDLE }}
        run: |
          umask 077
          B="$RUNNER_TEMP/bundle.txt"
          printf '%s\n' "$ASC_BUNDLE" | tr -d '\r' > "$B"
          KID=$(grep -m1 '^KEY_ID=' "$B" | cut -d= -f2- | tr -d ' ')
          IID=$(grep -m1 '^ISSUER_ID=' "$B" | cut -d= -f2- | tr -d ' ')
          TID=$(grep -m1 '^TEAM_ID=' "$B" | cut -d= -f2- | tr -d ' ')
          if [ -z "$KID" ] || [ -z "$IID" ] || [ -z "$TID" ]; then
            echo "ASC_BUNDLE 에 KEY_ID / ISSUER_ID / TEAM_ID 줄이 다 있어야 합니다"; rm -f "$B"; exit 1
          fi
          mkdir -p "$HOME/private_keys"
          sed -n '/BEGIN PRIVATE KEY/,/END PRIVATE KEY/p' "$B" > "$HOME/private_keys/AuthKey_$KID.p8"
          rm -f "$B"
          if ! grep -q 'END PRIVATE KEY' "$HOME/private_keys/AuthKey_$KID.p8"; then
            echo "ASC_BUNDLE 에 p8 열쇠 본문이 없습니다"; exit 1
          fi
          chmod 600 "$HOME/private_keys/AuthKey_$KID.p8"
          echo "::add-mask::$IID"
          echo "ASC_KEY_ID=$KID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$IID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TID" >> "$GITHUB_ENV"
          echo "열쇠 놓았습니다 (열쇠 ID $KID)"

      - name: 빌드 번호 매기기 (연월일시분)
        id: beonho
        run: echo "bn=$(TZ=Asia/Seoul date +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Xcode 프로젝트 만들기
        env:
          DEVELOPMENT_TEAM: ${{ env.TEAM_ID }}
        run: xcodegen generate

      - name: 짓기(archive)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -project AdaApp.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$SCHEME.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ steps.beonho.outputs.bn }}" \
            2>&1 | tee build/archive.log | tail -n 80 || { echo "===== 잘못된 곳 ====="; grep -E "error:|warning: .*signing|Provisioning" build/archive.log | head -n 60; exit 1; }

      - name: 내보내기 설정
        env:
          OLLIDA: ${{ github.event.inputs.ollida || 'true' }}
        run: |
          DEST=upload; if [ "$OLLIDA" != "true" ]; then DEST=export; fi
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          echo "내보내기: $DEST"

      - name: 올리기(export / upload)
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "build/$SCHEME.xcarchive" \
            -exportOptionsPlist build/export.plist -exportPath build/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log | tail -n 60

      - name: 기록 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME || 'AdaApp' }}-${{ steps.beonho.outputs.bn }}
          path: |
            build/*.log
            build/out
          if-no-files-found: ignore
