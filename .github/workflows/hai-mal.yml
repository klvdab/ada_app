# 하이 길눈 감지기 — 여러 사람 목소리로 바꾸기 (1.0.1판, 빌드 261001-H3, 대표님 승인 2026-10-01)
# 1.0.1 토치 판을 2.5.1 로 못박음 — 새 판은 소리 파일 읽기에 다른 부품(torchcodec)을 요구해 목소리 바꾸기가 하나도 되지 않았음
# hai-data 갈래의 "하이 길눈" 연습 소리를 공개 한국어 말소리 모음(제로스 한국어)의 실제 사람 목소리 100여 명으로 바꾸고,
# 그 사람들의 평소 말을 틀린 소리로 모아 hai-mal 갈래(앱 소스와 따로)에 올립니다. 앱 짓기와는 상관이 없습니다.
name: hai-mal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bakkugi:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        jo: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: 도구 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q huggingface_hub pyarrow soundfile scipy numpy
      - name: 연습 소리 받기
        run: |
          curl -sL -o /tmp/hai_sori.tar https://raw.githubusercontent.com/${{ github.repository }}/hai-data/hai_sori.tar
          cd /tmp && tar xf hai_sori.tar && mkdir -p /tmp/maja
          for f in /tmp/hai_sori/maja/*.flac; do ffmpeg -loglevel error -y -i "$f" -ar 16000 -ac 1 "/tmp/maja/$(basename "${f%.flac}").wav"; done
          ls /tmp/maja | wc -l
      - name: 목소리 바꾸기
        run: python3 tools/hai/byeonhwan.py ${{ matrix.jo }} 8 /tmp/maja /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: jo-${{ matrix.jo }}
          path: /tmp/out
          retention-days: 3
  mukki:
    needs: bakkugi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/jo
      - name: 묶어 올리기
        run: |
          sudo apt-get install -y -qq flac
          mkdir -p /tmp/hai_mal/maja_vc /tmp/hai_mal/teul_saram
          for d in /tmp/jo/*; do cp $d/maja_vc/*.wav /tmp/hai_mal/maja_vc/ 2>/dev/null; cp $d/teul_saram/*.wav /tmp/hai_mal/teul_saram/ 2>/dev/null; cp $d/mokrok_*.json /tmp/hai_mal/ 2>/dev/null; done
          cd /tmp/hai_mal && for f in maja_vc/*.wav teul_saram/*.wav; do flac -s -8 --delete-input-file "$f"; done
          ls maja_vc | wc -l; ls teul_saram | wc -l
          cd /tmp && tar cf hai_mal.tar hai_mal && ls -la hai_mal.tar
          mkdir /tmp/gal && cd /tmp/gal && split -b 90m -d /tmp/hai_mal.tar hai_mal.tar.
          printf '하이 길눈 감지기 — 여러 사람 목소리 (빌드 261001-H2). 만든 곳: tools/hai/byeonhwan.py. 바탕 말소리: 제로스 한국어(CC BY 4.0)\n' > README.txt
          git init -q && git checkout -q -b hai-mal
          git add . && git -c user.name=hai-mal -c user.email=noreply@ada.or.kr commit -qm "하이 길눈 여러 사람 목소리 (261001-H2)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hai-mal
