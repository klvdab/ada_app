# 길눈 사용법 동영상 만들기 1.0 (빌드 261018-2, 이사장님 승인 2026-10-18 「1」 — 52편 모두 새 목소리로)
# 편마다 한 일꾼이 아이폰·안드로이드 두 판을 만들고, 다 모아 sayong-dongyeongsang 갈래에 올림(대장클이 받아 나스에 올림)
name: sayong-dongyeongsang
on:
  workflow_dispatch:
    inputs:
      pyeon:
        description: "만들 편(띄어 쓰기). 비우면 모두"
        default: ""
permissions:
  contents: write
jobs:
  mokrok:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: |
          P="${{ github.event.inputs.pyeon }}"
          [ -z "$P" ] && P="c1 c2 c3 c4 c5 c6 c7 c8 c9 c10 c11 c12 c13 c14 c15 c16 c21 c22 c23 c24 c25 c26 c27 c28 c29 c210"
          echo "list=$(printf '%s\n' $P | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  mandeulgi:
    needs: mokrok
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        c: ${{ fromJSON(needs.mokrok.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - run: pip install -q sherpa-onnx==1.13.8 numpy soundfile librosa playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p tts && cd tts
          curl -sSL -o st.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-tts-int8-2026-03-06.tar.bz2
          tar xjf st.tar.bz2 && rm st.tar.bz2
      - env:
          SUPERTONIC: ${{ github.workspace }}/tts/sherpa-onnx-supertonic-tts-int8-2026-03-06/
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p nae
          c=${{ matrix.c }}; n=${c#c}
          cd tools/sayong
          python3 make.py dae/$c.py ../../nae/i$n.mp4
          python3 make.py dae/$c.py ../../nae/a$n.mp4
      - uses: actions/upload-artifact@v4
        with: { name: "dy-${{ matrix.c }}", path: nae/*.mp4, retention-days: 3 }
  moeugi:
    needs: mandeulgi
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "dy-*", merge-multiple: true, path: nae }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd nae && ls -l *.mp4 | awk '{print $9, $5}' > keugi.txt && cat keugi.txt
          for f in *.mp4; do ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | xargs printf "%s %s\n" "$f"; done > gil.txt
          git init -q && git checkout -q -b sayong-dongyeongsang
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "길눈 사용법 동영상" && git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sayong-dongyeongsang
