# 안드로이드 앱 자동 짓기 (1.0.1판, 빌드 260923-2)
# 깃허브가 빌려 주는 리눅스에서 안드로이드 앱을 짓습니다. 맥이 필요 없어 애플보다 빠릅니다.
# 세 앱을 한 프로젝트에 담았습니다(갈래).
#   gilnun  길눈 (kr.or.ada.app)
#   jabong  자봉 (kr.or.ada.jabong)
#   bfb     배프 (kr.or.ada.bfb)
# 서명(플레이에 올릴 때 필요)은 비밀값 ANDROID_BUNDLE 하나로 받습니다. 아래 네 줄을 한 덩이로 넣습니다.
#   STORE_PASSWORD=열쇠집 비밀번호
#   KEY_ALIAS=열쇠 이름
#   KEY_PASSWORD=열쇠 비밀번호
#   KEYSTORE_BASE64=열쇠집 파일(jks)을 base64 로 바꾼 글자
# 비밀값이 없으면 서명 없이 시험용으로만 짓습니다.
# 1.0.1판에서 고친 것: 그레들 판을 8.11.1 로 못박음(9판은 안드로이드 플러그인 8.7 과 맞지 않음), 잘못된 곳을 더 자세히 찍게 함
name: android-jitgi
on:
  workflow_dispatch:
    inputs:
      eoneu:
        description: "어느 앱 (gilnun = 길눈, jabong = 자봉, bfb = 배프)"
        default: "gilnun"
jobs:
  jitgi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: 어느 앱인지 정하기
        env:
          EONEU: ${{ github.event.inputs.eoneu || 'gilnun' }}
        run: |
          case "$EONEU" in
            gilnun|"") FL=gilnun; CAP=Gilnun; NM=길눈 ;;
            jabong)    FL=jabong; CAP=Jabong; NM=자봉 ;;
            bfb)       FL=bfb;    CAP=Bfb;    NM=배프 ;;
            *) echo "eoneu 는 gilnun, jabong, bfb 중 하나여야 합니다 (받은 값: $EONEU)"; exit 1 ;;
          esac
          echo "FLAVOR=$FL" >> "$GITHUB_ENV"
          echo "FLAVOR_CAP=$CAP" >> "$GITHUB_ENV"
          echo "APPNAME=$NM" >> "$GITHUB_ENV"
          echo "짓는 앱: $NM (갈래 $FL)"

      - name: 자바 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 그레들 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 빌드 번호 매기기 (연월일시분)
        id: beonho
        run: |
          BN=$(TZ=Asia/Seoul date +%y%m%d%H%M)
          echo "bn=$BN" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$((10#$BN))" >> "$GITHUB_ENV"

      - name: 아이콘 만들기
        run: |
          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet pillow
          /tmp/py/bin/python tools/make_android_icon.py "$FLAVOR"

      - name: 열쇠 풀어 놓기
        env:
          ANDROID_BUNDLE: ${{ secrets.ANDROID_BUNDLE }}
        run: |
          if [ -z "$ANDROID_BUNDLE" ]; then
            echo "ANDROID_BUNDLE 이 없어 서명 없이 시험용으로만 짓습니다."
            echo "SEOMYEONG=no" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          B="$RUNNER_TEMP/abundle.txt"
          printf '%s\n' "$ANDROID_BUNDLE" | tr -d '\r' > "$B"
          SP=$(grep -m1 '^STORE_PASSWORD=' "$B" | cut -d= -f2-)
          KA=$(grep -m1 '^KEY_ALIAS=' "$B" | cut -d= -f2- | tr -d ' ')
          KP=$(grep -m1 '^KEY_PASSWORD=' "$B" | cut -d= -f2-)
          KB=$(grep -m1 '^KEYSTORE_BASE64=' "$B" | cut -d= -f2- | tr -d ' \n')
          if [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ] || [ -z "$KB" ]; then
            echo "ANDROID_BUNDLE 에 네 줄(STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD/KEYSTORE_BASE64)이 다 있어야 합니다"
            rm -f "$B"; exit 1
          fi
          printf '%s' "$KB" | base64 -d > ada_upload.jks
          rm -f "$B"
          {
            echo "storeFile=ada_upload.jks"
            echo "storePassword=$SP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > keystore.properties
          chmod 600 ada_upload.jks keystore.properties
          echo "::add-mask::$SP"
          echo "::add-mask::$KP"
          echo "SEOMYEONG=yes" >> "$GITHUB_ENV"
          echo "열쇠 놓았습니다"

      - name: 짓기
        run: |
          set -o pipefail
          gradle --version
          gradle "assemble${FLAVOR_CAP}Release" "bundle${FLAVOR_CAP}Release" --no-daemon --stacktrace 2>&1 | tee build.log | tail -n 120 || true
          if ! grep -q "BUILD SUCCESSFUL" build.log; then
            echo "===== 잘못된 곳 ====="
            sed -n '/What went wrong/,/^$/p' build.log | head -n 40
            grep -nE "error:|^e: |Caused by|Unsupported|requires Gradle|Could not|No such|not found" build.log | head -n 40
            exit 1
          fi

      - name: 만들어진 것 살펴보기
        run: |
          echo "--- APK ---"; find app/build/outputs/apk -name "*.apk" -print 2>/dev/null || true
          echo "--- AAB ---"; find app/build/outputs/bundle -name "*.aab" -print 2>/dev/null || true
          echo "서명 여부: $SEOMYEONG"

      - name: 기록 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-${{ env.FLAVOR || 'gilnun' }}-${{ steps.beonho.outputs.bn }}
          path: |
            android/build.log
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
