# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# LVD 수업 아이폰 설계도. 이 앱의 판 번호(MARKETING_VERSION)와 설정은 이 파일에서만 고칩니다.
# 짓기: build.yml 이 eoneu 에 맞춰 이 파일만 씀(xcodegen generate --spec seolgye_sueop.yml)
name: AdaApp
include:
  - seolgye_gongtong.yml
targets:
  SueopApp:
    # 0.1.0 (261020-SI1, 이사장님 승인 2026-10-20 「단독으로 가자」, 방클) LVD 수업 — 강사님이 노트북 「수업 이끌기」에서 넘기는 자료를 교육생 폰에서 그대로 보는 앱(Sueop 폴더)
    # 웹 수업 보기(lvd.ada.or.kr/sueop/index.html 0.2판)와 같은 서버(sueop.php). 특별한 허락이 필요 없음(카메라·마이크·위치를 쓰지 않음)
    type: application
    platform: iOS
    sources:
      - path: Sueop
    info:
      path: Sueop/Info.plist
      properties:
        CFBundleDisplayName: LVD 수업
        CFBundleName: SueopApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.sueop
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.1"   # 261021-SI2 도움말 번호 틀릴 때 말 맞춤(새방클) · 261020-SI1 첫 판 — 웹 수업 보기 0.2판의 기능 모두(방 번호·장 그림과 글·빨간 테두리·프로그램 화면·로고·화면 꺼짐 막기·나가기 여쭘·마침·끊김 알림)와 바뀐 일만 알림·가리키는 곳의 말·그림 크게 보기·글자 크기·지난번 방·도움말·새 판 알림·이용 기록(방클, 이사장님 승인 2026-10-20 「단독으로 가자」)
schemes:
  SueopApp:
    build:
      targets:
        SueopApp: all
    archive:
      config: Release

