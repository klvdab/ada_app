# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# LVD 송출(BYOD) 아이폰 설계도. 이 앱의 판 번호(MARKETING_VERSION)와 설정은 이 파일에서만 고칩니다.
# 짓기: build.yml 이 eoneu 에 맞춰 이 파일만 씀(xcodegen generate --spec seolgye_byod.yml)
name: AdaApp
include:
  - seolgye_gongtong.yml
targets:
  ByodApp:
    # 1.1.5 (261010-BI1, 2026-10-10 이사장님 승인 「아이폰용도 진행」, 방송클) BYOD 방송 아이폰 — 안드로이드 BYOD 방송 1.1.5와 같은 기능
    # 화면을 잠가도 해설 소리 받기와 나눠 보내기가 이어지도록 뒤에서 소리(audio), 엔에프시 스티커 쓰기(TAG)
    type: application
    platform: iOS
    sources:
      - path: Byod
    info:
      path: Byod/Info.plist
      properties:
        CFBundleDisplayName: LVD 송출
        CFBundleName: ByodApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIRequiresPersistentWiFi: true
        NSMicrophoneUsageDescription: 현장영상해설사의 해설 소리(수신기 선을 꽂은 사운드카드나 아이폰 마이크)를 받아 같은 공유기에 붙은 듣는 분 폰들과 인터넷 방송으로 보내고, 현장영상해설교육을 녹화하는 데 마이크를 씁니다.
        NSCameraUsageDescription: 현장영상해설교육과 BYOD 방송의 무대를 영상으로 녹화하는 데 카메라를 씁니다.   # 1.9.0 (261024-BI11) 무대 영상 녹화
        NSLocalNetworkUsageDescription: 같은 공유기에 붙은 듣는 분 폰들에 현장영상해설을 보내는 데 로컬 네트워크를 씁니다.
        NFCReaderUsageDescription: 접수대에서 듣는 분 안드로이드폰이 한 번에 방송 와이파이에 붙도록 엔에프시 스티커에 와이파이와 듣기 주소를 쓰는 데 씁니다.
        NSPhotoLibraryAddUsageDescription: 인쇄할 큐알코드 그림을 사진 앱에 저장하는 데 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    entitlements:
      path: Byod/ByodApp.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.byod
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.10.0"   # 261026-BI14 소리 방식 오푸스(시험)(새방클, 이사장님 승인 2026-10-26). 261026-BI13 소리 자동 맞춤(새방클, 이사장님 지시 2026-10-26). 261025-BI12 공유기에서 떨어짐 알림(새방클, 이사장님 승인 2026-10-25). 261024-BI11 대조표 미진한 부분 고치기(새방송클, 이사장님 지시 2026-10-24) — 공유기 스스로 알아내기·다른 와이파이 경고·전화번호 안내·무대 영상 녹화·노트북판 현장 기능·여러 갈래 해설·만족도·구역별 인원. 261023-BI10 이용 기록·현장 점검에 듣는 앱이 찾을 자리(새방클, 이사장님 지시 2026-10-23). 261021-BI9 공유기 고르기(아이피타임·플린트 2) 첫 화면, 아이피타임 방식 이름, 이 아이폰이 행사 녹음·다시 듣기에 올림, 큐알을 약 5센티미터로 작게(방클, 이사장님 승인 2026-10-21). 261019-BI8 녹화·방송 지킴이(멈추면 3초에 한 번 알림)·녹화 다시 잇기·BYOD 방송 이름(방클, 이사장님 지시 2026-10-19). 261018-BI7 LVD 방송 정리 — 현장 방송 시작(인터넷 방송도 함께, 셀룰러), 전화번호 칸, 인터넷 방송만 하기·TV해설방송 하기, 다시 듣기에 같은 행사 하나만(방클, 이사장님 승인 「1」). 261016-BI6 첫 화면에 라이브 현장영상해설 방송(인터넷)·현장영상해설교육 녹화(앱 안 화면·카메라 마이크·화면 꺼짐 막기, 방클, 이사장님 지시). 261015-BI5 이름을 LVD 송출로 바꿈(듣는 앱 LVD 방송과 나눔), 통화 중 듣는 분께 「잠시 기다려 주십시오」 안내(방송클, 이사장님 승인 「1」). 261014-BI4 행사 녹음과 결과보고를 배프 다시듣기에 올림, 행사 이름·현장영상해설사 칸, 지난 행사 기록(방송클, 이사장님 승인 「1」). 261014-BI3 플린트 2 방식 — 방송 서버를 공유기 안에 두고 이 아이폰은 해설 소리만 보냄, 와이파이 태그·큐알 한 장으로 듣기까지, 예비로 아이폰 서버 방식(방송클, 이사장님 승인 「1」). 261012-BI2 엔에프시 태그로 부름·듣기 주소 바로잡기와 확인·태그 쓴 뒤 다시 읽어 확인·A4 인쇄용 한 장(방송클, 이사장님 승인). 261010-BI1 아이폰 첫 판 — 방송·현장 점검·소리 크기·멈춘 폰 빼기·접속 도구(엔에프시·큐알)·기기 점검·도움말·새 판 알림(방송클, 이사장님 승인)
schemes:
  ByodApp:
    build:
      targets:
        ByodApp: all
    archive:
      config: Release
