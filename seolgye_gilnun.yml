# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# 길눈(협회 앱)·자봉·애플워치 — 같은 Gilnun 부품 폴더를 함께 써서 한 설계도로 묶음 아이폰 설계도. 이 앱의 판 번호(MARKETING_VERSION)와 설정은 이 파일에서만 고칩니다.
# 짓기: build.yml 이 eoneu 에 맞춰 이 파일만 씀(xcodegen generate --spec seolgye_gilnun.yml)
name: AdaApp
include:
  - seolgye_gongtong.yml
packages:
  WebRTC:                       # 2.4.0 (260928-5) 길눈 긴급통화서비스의 앱 자체 화상통화 — 구글 WebRTC 공개 부품
    url: https://github.com/stasel/WebRTC
    exactVersion: "153.0.0"
targets:
  AdaApp:
    # 2.0.0 (빌드 260928-1, 2026-09-28 이사장님 지시) 길눈은 속까지 앱으로 — 웹을 띄우던 App 폴더 대신 Gilnun 폴더의 자체 코드로 짓습니다.
    # 자봉 앱·배프 앱은 App 폴더를 그대로 씁니다.
    type: application
    platform: iOS
    sources:
      - path: Gilnun
      - path: App/Assets.xcassets
    dependencies:
      - target: AdaWatch
        embed: true
      - package: WebRTC
    info:
      path: Gilnun/Info.plist
      properties:
        CFBundleDisplayName: 길눈
        CFBundleName: AdaApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification, bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.or.ada.app.gongji]
        LSSupportsOpeningDocumentsInPlace: false   # 1.6.9 받은 동영상은 길눈 보관함으로 옮겨 틂
        CFBundleDocumentTypes:   # 1.6.9 카톡·문자·사진에서 공유 → 길눈으로 동영상 받기(길눈은 다른 앱 다음 차례로만 나섬)
          - CFBundleTypeName: 동영상
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.avi]
        NSLocationWhenInUseUsageDescription: 길눈이 걷는 동안 방향과 남은 거리를 안내하려면 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 폰이 주머니에 있어도 갈림길 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 라이브 현장영상해설 방송과 시지각 판독, 사진 읽어 주기와 안면인식, QR 찾기, 문 찾기, 즉석 글자 읽기, 가리키고 말하기, 사람 감지, 상품 바코드 읽기, 지폐와 색깔 알아보기, 빛 알아보기, 한마디 설명, 발 앞 계단·턱 알림(폰 안에서만)에 카메라를 씁니다.
        NSMicrophoneUsageDescription: 길눈을 말로 시키고 목적지·역 이름을 말로 넣는 데, 그리고 라이브 현장영상해설 방송에 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말씀하신 목적지와 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다. 받아쓰기는 폰 안에서 합니다.
        NSBluetoothAlwaysUsageDescription: 길가의 음성유도기와 음향신호기를 켜는 데 블루투스를 씁니다.
        NSMotionUsageDescription: 점지도를 따라 걸을 때 걸음과 몸이 돈 방향을 재어 걸음마다 확신음을 내고 위성이 끊겨도 걸음으로 안내를 이어 가는 데, 되짚어 나가기로 건물 안에서 걸은 길을 기억하는 데, 말로 그린 길에서 걸음을 곧바로 세는 데, 보폭 재기와 폰을 흔들어 긴급통화 열기에 움직임 정보를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/AdaApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.108.0"   # 261025-I62 탭을 고르면 커서가 내용 첫 줄로(이사장님 지적 2026-10-25). 261025-I61 TV 전체화면 바로잡음 — 영상을 90도 돌려 화면 가득(이사장님 지적 2026-10-25). 261025-I60 TV 전체화면 보기(이사장님 승인 2026-10-25). 261024-I59 지하철 타신 역 여쭙기·짐작 자리 가림·틀렸어 되돌리기·여기는 ○○역이야(이사장님 지시 2026-10-24). 261024-I58 긴급통화 카메라 — 켜졌는지·찍혀 나가는지 살핌, 못 켜면 다시·앞 카메라, 연결 알림에 카메라 형편, 허락 미리 살핌, 기록(이사장님 지시 2026-10-24). 261021-I57 소리 관리자(보이스오버가 읽는 동안 안내·마이크 기다림, 마이크 잇단 막힘 알림), 차 부르기 통화 확인 창 동안 마이크 쉼·말끝 네, 탭 바 커서 맨 위(iOS 27), 점지도 도착은 걸은 뒤, 문까지 걸음 수(라이다 없는 폰), 위치 오류 까닭, 오래된 판 알림(이사장님 승인 2026-10-21). 261020-I56 걸음 나눔 신고하기·보지 않기(앱스토어 정식 심사 요건, 이사장님 승인 2026-10-20). 261019-I55 나눔 마당 마침표·그려 주세요 줄 「자원봉사자님이 그려 주셨습니다」(이사장님 승인 2026-10-19 「1」). 261018-I54 동영상 강의 — 길눈 사용법 26편을 앱 안에서, 도움말 항목마다 그 기능의 강의, 이름 없는 조회수(이사장님 승인 2026-10-18 「1」). 261018-I53 기차 안내 선로 맞추기 — 타신 선로 앞의 터널·다음 역만, 서는 역 전체, 기차 위치 기록(이사장님 승인 2026-10-17 「1」). 261017-I52 기차 안내 — 역을 지난다는 말은 실제로 지난 뒤에만, 여정 시험 통과(이사장님 승인 2026-10-17). 261017-I51 기차 안내 바로잡음 — 내릴 역은 한 곳만, 서지 않는 역에서 멈춤, 다른 노선 터널 거름(이사장님 KTX에서 겪으심 2026-10-17). 261017-I50 안내가 소리 없이 멈추던 것 바로잡음 — 소리 자리를 빼앗긴 뒤 말 줄 막힘 풀기(이사장님 KTX에서 겪으심 2026-10-17). 261017-I49 웹 길눈에서 옮긴 것 4단계 — 미리 걸어 보기(이사장님 승인 2026-10-17). 261017-I48 웹 길눈에서 옮긴 것 3단계 — 긴급통화 내 자리 보내기, 「집에 가자」·「사무실 가자」로 말로 그린 길 바로 시작(이사장님 승인 2026-10-17). 261017-I47 웹 길눈에서 옮긴 것 2단계 — 교통편, 섬으로 가기·타기 전에 챙길 것, 지금 시각·지하철 고장, 자동 입력, 요즘 찾으신 곳(이사장님 승인 2026-10-17). 261017-I46 웹 길눈에서 옮긴 것 1단계 — 차 안 터널·크게 돌 때·멈춘 까닭, 지하철 다음 열차, 지난 여정 여쭙기, 교통 상황 시간, 길 자료 미리 받기(이사장님 승인 2026-10-17). 261017-I45 기차 안내 — 역 도착·떠남·지나감·내릴 역, 터널 미리 알림, 열차 시간표로 도착 예정(이사장님 승인 2026-10-17). 261017-I44 탈것 고르기 — 기차로 가기·배로 가기, 탈것 바꾸기 한 줄로 접고 부르면 펼침(이사장님 승인 2026-10-17). 261017-I43 음악·방송 탭 손질·둘러보기 네 가지(이사장님 승인 2026-10-17). 261016-I42 둘러보기 — 현장영상해설 받기 줄 감춤·말로 하면 긴급통화로 요청, 카메라 눈 말 줄이기, 도움말(이사장님 승인 2026-10-16). 261016-I41 그 밖에 펼치기 손질·음향신호기 블루투스 알림·되짚어 나가기 단추 통일·도움말 바로잡음(이사장님 승인 2026-10-16). 261016-I40 긴급통화서비스 손질·가족·지인 별명(이사장님 승인 2026-10-16). 261016-I39 말로 하기 — 안드로이드와 같게·도움말 바로잡음(이사장님 승인 2026-10-16). 261016-I38 지금 내 자리 듣기 — 안드로이드와 같게(이사장님 승인 「1」). 261016-I37 차 부르기 — 안드로이드와 같게(이사장님 승인 「2」). 261016-I36 버스로 가기 화면 제목·버스 안 안내 단추 — 안드로이드와 같게(이사장님 승인 「1」). 261016-I35 자봉 그리기 탭 이름 따라 안내 바로잡음(이사장님 지시). 261016-I34 긴급통화 가족·지인 40초·이음 번호 세 자리·열 분까지 — 안드로이드와 같게(이사장님 승인 「1」). 261015-I33 지하철로 가기 화면 제목 — 안드로이드와 같게(이사장님 승인). 261015-I32 점지도 길 고르기·점지도 안내 설정·다시 듣기 — 안드로이드와 같게(이사장님 승인). 261015-I31 차 안 안내 100·30미터·내리면 점지도 확인·부른 콜 이름·차 부르기 네로 전화(이사장님 승인 「1」). 261015-I30 새 목적지면 문까지 이끌기 멈춤·걷는 안내 도움말 — 안드로이드와 같게(이사장님 승인 「1」). 261015-I29 찾은 곳·목적지 화면 제목 — 안드로이드와 같게(이사장님 승인). 261014-I28 차 부르기 「다른 수단 펼치기」 이름 — 안드로이드와 같게(이사장님 승인). 261014-I27 음향신호기 찾기 멈추기·긴급통화 글자·멈추기에 말로 그린 길 — 안드로이드와 같게(이사장님 승인). 261014-I26 음향신호기 위치 안내 단추·위치 허락 안내 — 안드로이드와 같게(이사장님 승인). 261014-I25 도움말 길 찾기 첫 화면 차례(이사장님 승인 「1」). 261014-I24 설정 탭 차례를 한 잣대로(이사장님 승인 「1」). 261014-I23 길 부탁 출발지·도착지는 고른 건물·가게 이름으로만(직원 시험 뒤 이사장님 지시). 261014-I22 지금 내 자리 출구 호선 뺌·두 출구 사이·버스정류장 이름과 번호·콜 상담원께 타는 곳·자리 말 기록(이사장님 승인). 261013-I21 막힘 판단 바로잡음·전철역만 말하면 어디까지 여쭘·멀어지면 알림·통화 뒤 다시 여쭘·콜 차 버스로 안 바꿈(이사장님 승인). 261013-I20 말로 하기 막힘 풀기·협회 목소리 미리 받기·도착 뒤 문까지 이끌기·음악 다시 잇기·기록 이름(이사장님 승인 「그래」). 261012-I19 「무엇을 타고 계신가요」 물음 — 차·걷기 넣음, 걷는 차례에도 보임(이사장님 지시). 261011-I18 기차 알아보기·기차와 배 지킴·바로잡기 단추 꺼냄·배(선박) 넣음·바다 위 지금 자리·내리셨는지 여쭘·빠를 때 간판 쉼·터널 땅속 아님·마이크 다시 잡기(이사장님 승인 「1」). 261010-I17 낙상 주의 겹 감시·길 폭·되돌아가는 곳, 점지도 따라 걷기를 걸음 바탕으로 — 그린 이 걸음×보폭 거리·내 보폭 비교, 좌우 한 걸음은 걸음과 방향으로, 돌아섬 알림·남은 걸음 늘어남, 자리·말 기록(이사장님 승인 「1」). 261010-I16 고장 노래 저절로 틀기 한 번 끔으로 되돌림·이어 들을 때도 네(이사장님 승인). 261009-I15 탈것 바로잡기 단추·콜 못 박기 풂·땅속 판단·전화 중 마이크·엄격한 네 아니오·긴급통화 거절 알림·한 폰 표·점지도 탈것 구간(이사장님 승인). 261009-I14 목적지 바꾸기 전 여쭘·한 마디 거름·콜 다시 걸기 막음·콜 배차 뒤 차 못 박기·차 안 안내 바로잡기·편집 중 화면 굳히기(이사장님 승인). 261009-I13 전화 오거나 걸면 모든 소리 멈춤·방송 이어 듣기, 땅속 판단·지역 찾기·탈것 기록 바로잡음, 자봉 점지도 잇기 점검, 아침 기록(이사장님 승인). 261009-I12 차 부르기·정기 호출·이용 기록(이사장님 승인). 261008-I11 차에 타면 고장 노래 저절로 틀기 처음값 끔(이사장님 지시). 261007-I10 차 안 길 맞춤·안내 정도(이사장님 허락), 보기 문장 시계 방향. 261007-I9 목소리 따라 걷기(이사장님 확정 방식). 261007-I5 새 판 알림(이사장님 승인)
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]   # 1.6.0 옛 폰에서도 앱이 열리게 약하게 잇기
  JabongApp:
    # 2.0.0 (빌드 261001-7, 2026-10-01 대표님 승인) 자봉 앱도 속까지 앱으로 — 웹을 띄우던 App 폴더 대신
    # 길눈 부품 폴더(Gilnun)를 통째로 함께 싣고, 시작 파일만 자봉 것(Jabong/JabongApp.swift)으로 바꿉니다.
    type: application
    platform: iOS
    sources:
      - path: Gilnun
        excludes:
          - GilnunApp.swift
          - GilnunIntent.swift
          - Info.plist
      - path: Jabong
        excludes:
          - MomSensor.swift   # 1.6.7 몸 센서는 Gilnun/MomSensor.swift 로 옮김(같은 이름 두 벌 막기)
    dependencies:
      - package: WebRTC
    info:
      path: Jabong/Info.plist
      properties:
        CFBundleDisplayName: 자봉
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleName: JabongApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AdaHomeURL: https://lvd.ada.or.kr/jabong/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification, voip]   # 2.1.0 긴급통화가 전화처럼 울리게
        NSLocationWhenInUseUsageDescription: 도움을 청한 분이 계신 곳까지 찾아가는 데 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 봉사 가는 길에 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 도움을 청한 분과 화상으로 이어 현장을 살피는 데 카메라를 씁니다.
        NSMicrophoneUsageDescription: 도움을 청한 분과 말을 주고받고, 점지도 표시마다 그 자리 모습을 짧게 말로 남기는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 하시는 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다.
        NSMotionUsageDescription: 점지도를 그릴 때 걸음, 몸이 돈 방향, 오르내림과 멈춤을 재는 데 움직임 정보를 씁니다.
        NSBluetoothAlwaysUsageDescription: 길가의 음성유도기와 음향신호기를 켜는 데 블루투스를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Jabong/JabongApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.jabong
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.33.0"   # 261025-I27 탭을 고르면 커서가 내용 첫 줄로(이사장님 지적 2026-10-25, 길눈 2.108.0과 같음). 261025-I26 프로그램 끝내기 — 저장 뒤 위치·걸음·소리 멈추고 첫 화면으로, 긴급통화 받기 켜 둘지 여쭘(이사장님 승인 2026-10-25). 261024-I25 안내 말소리 처음부터 끔 — 시험 참가자들이 소리를 부담스러워함(이사장님 지시 2026-10-24). 261024-I24 긴급통화 받기 — 길손님 영상을 받은 장 수 살핌·오지 않으면 알림, 길눈과 함께 쓰는 카메라 지킴(이사장님 지시 2026-10-24). 261021-I23 길눈과 함께 쓰는 부품 손질(보이스오버 읽는 동안 안내 기다림, 소리 멈춤 기록, 위치 오류 까닭, 오래된 판 알림 — 대클, 이사장님 승인 2026-10-21). 261020-I22 회원 탈퇴 — 협회 등록에서 이름·연락처 지우기, 도움말(앱스토어 정식 심사 요건, 이사장님 승인 2026-10-20 「그래」). 261019-I21 앱 잘못 15가지 바로잡음 — 보폭·지금 상태 듣기·새로고침·도움말 등(이사장님 승인 2026-10-19 「1」). 261018-I20 동영상 강의 — 자봉 사용법 21편을 앱 안에서, 도움말 항목마다 강의, 도움말 두 곳 바로잡음(이사장님 승인 2026-10-18 「3」). 261017-I19 긴급통화 길손님 자리 보기 — 주소·국가지점번호·바라보는 쪽·빠르기·지도(이사장님 승인 2026-10-17). 261016-I18 첫째 탭 이름 그리기(이사장님 지시). 261016-I17 이음 번호 세 자리·밤에도 받기 — 안드로이드와 같게(이사장님 승인 「1」). 261014-I16 처음엔 가볍게 — 등록은 이름·연락처·네 자리 숫자만, 첫 길 그려 보기, 첫 점지도 큰 박수, 교육 마당(동영상 넷·약속·실력 다지기·배지)(이사장님 승인 「1」). 261014-I15 내 기록 1365 넣기·고치기, 보완하기, 위성 위치 출발지 표시(직원 시험 뒤 이사장님 지시). 261012-I14 AI 밑그림 듣기·꺾는 곳 미리 알림·다 걸은 뒤 견주기·표시 빠짐·카카오 지도(대장클, 이사장님 승인 「1」). 261010-I13 새 표시 낙상 주의 시작·끝·길 폭·되돌아가는 곳(이사장님 승인 「1」). 261010-I12 점검에서 고칠 곳이 나와도 받고 보완 목록에(이사장님 승인). 261009-I11 긴급통화 거절 알림·30초 닫힘·한 폰 표·에스컬레이터 되돌아가기(이사장님 승인). 261009-I10 길눈과 함께 쓰는 부품 손질(이사장님 승인). 261009-I9 전화 중 소리 멈춤, 기록 이름표(이사장님 승인). 261007-I8 그려 주세요와 그린 길 잇기(이사장님 지시). 261007-I7 보완 부탁(이사장님 지시). 261007-I6 새 판 알림(이사장님 승인). 261007-I4 봉사자 요청 여섯 가지(계단 여쭙기 없앰·말로 자유 표시·올리기·지우기·출발지 도착지 이름·안내 말소리 끄기, 이사장님 승인). 261007-I3 방향은 늘 시계 방향으로(이사장님 지시). 261007-I1 점지도 일곱 가지 약속·확인 문제 아홉 개(이사장님 승인)
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]   # 길눈 부품과 같이 옛 폰에서도 열리게
