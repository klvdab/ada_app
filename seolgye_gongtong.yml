# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# 모든 아이폰 앱이 함께 쓰는 설정(서명·말·최소 iOS). 앱별 설계도(seolgye_*.yml)가 include 로 불러 씀. 여기를 고치면 모든 앱에 듭니다.
options:
  bundleIdPrefix: kr.or.ada
  developmentLanguage: ko   # 260926-2 허락 창·단추가 영어로 나오던 것 — 앱 기본 말을 한국어로
  deploymentTarget:
    iOS: "16.4"
    watchOS: "9.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "260923001"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
