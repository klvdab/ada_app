# 2026-11-17 (261117-DY1, 새방클 — 이사장님 승인 「1,2」, 대클 형님 의견대로) 투어스튜디오 사용법 동영상 화면 찍기 전용 설계도.
# 정식 짓기(seolgye_tour.yml)는 건드리지 않고, 이 파일이 그것을 불러와 UI 시험(TourUITests)만 더합니다.
# 쓰는 곳: .github/workflows/tour-dongyeong.yml 하나뿐. 앱스토어·테스트플라이트 짓기에는 쓰지 않습니다.
include:
  - seolgye_tour.yml
targets:
  TourUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TourUITests
    dependencies:
      - target: TourApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.tourstudio.dongyeong
        TEST_TARGET_NAME: TourApp
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  TourDongyeong:
    build:
      targets:
        TourApp: all
        TourUITests: [test]
    test:
      config: Debug
      targets:
        - TourUITests
