# 협회 앱 · 자봉 앱 · 배프 앱 · AI점자도서관 — XcodeGen 설계도 (1.7.4판, 빌드 261002-7 — 길눈 2.38.0 꺾는 곳 진동·음향신호기 기록)
# 1.7.9 (261004-I1, 이사장님 승인) 길눈 2.43.0·자봉 2.5.0 — 영상 다리 주소를 나스 설정 쪽지에서 읽음. 설정 바뀐 것 없음
# 1.7.8 (261004-G1, 이사장님 승인) 길눈 2.42.0·자봉 2.4.0 — 긴급통화 자봉 앱 하나로 받기(가족·지인 이음 번호, 받지 않기, 고르게 울리기). 설정 바뀐 것 없음
# 1.7.7 (261003-W1, 이사장님 지시) 길눈 2.41.0 — 애플워치 두 번 집기 바로잡음(설정 바뀐 것 없음)
# 1.7.6 (261003-T1, 이사장님 승인) 길눈 2.40.0 — 탈것 저절로 알아채기·지하철 바로잡음(Gilnun/TalgeotGamji.swift 새 파일, 설정 바뀐 것 없음 — 움직임 허락 글은 이미 있음)
# 1.7.5 (261003-K1, 이사장님 지시) 길눈 2.39.0 — 지방 콜 부르기 바로잡음(Gilnun/KolJiyeok.swift 새 파일, 설정 바뀐 것 없음)
# 1.7.4 (261002-7, 대표님 승인) 길눈 2.38.0 — 판만 올림(설정 바뀐 것 없음)
# 1.7.3 (261002-6, 대표님 승인) 길눈 2.37.1 — 판만 올림(설정 바뀐 것 없음)
# 1.7.2 (261002-5, 대표님 승인) 길눈 2.37.0 — 지팡이 떨림 기록(Watch/JipangiTteollim.swift 새 파일), 워치 움직임 허락 글에 지팡이 떨림을 더함
# 1.7.1 (261002-4, 대표님 승인) 길눈 2.36.0 — 워치 손목 가리키기(Watch/SonmokGariki.swift 새 파일, 설정 바뀐 것 없음)
# 1.7.0 (261002-3, 대표님 승인) 길눈 2.35.0 — 워치 깨어 있기(WKBackgroundModes physical-therapy), 워치 걸음 세기(NSMotionUsageDescription)
# 1.6.9 (261002-2, 대표님 승인) 길눈 2.34.0 — 공유 목록에서 동영상을 길눈으로 받기(CFBundleDocumentTypes), 워치에서 틀기
# 1.6.8 (261002-1, 대표님 승인) 길눈 2.33.0 — 애플워치 손가락 두 번 집기 횟수로 다음 갈림길·내 자리·말하기
# 1.6.7 (261001-14, 대표님 지시) 길눈 2.32.0 — 몸 센서를 길눈 따라 걷기에도(MomSensor.swift 를 Gilnun 폴더로 옮겨 두 앱이 함께 씀)
# 1.6.6 (261001-13, 대표님 지시) 자봉 앱 2.3.0 — 몸 센서 극대화(Jabong/MomSensor.swift 새로), 움직임 쓰임 안내 문구 고침
# 1.6.5 (261001-12, 대표님 승인) 길눈 2.31.0 — 하이 길눈 빠르게
# 1.6.4 (261001-11, 대표님 승인) 자봉 앱 2.2.0 — 점지도 그리기(속까지 앱), 기압계 높이
# 1.6.3 (261001-10, 대표님 승인 1) 길눈 2.30.0 — 하이 길눈 귀를 하나로, 네·잠깐만 기다려 주세요
# 1.6.2 (261001-9, 대표님 승인) 자봉 앱 2.1.0 — 긴급통화 받기(VoIP 알림·CallKit), 뒤에서 깨기 voip
# 1.6.1 (261001-7, 대표님 승인) 자봉 앱 2.0.0 — 웹 껍데기 대신 길눈 부품 + Jabong 폴더 자체 코드
# 1.6.0 (261001-6, 대표님 승인) 길눈 2.29.0 — 말뜻 풀이(Foundation Models, 약하게 잇기)
# 1.5.9 (261001-5, 대표님 승인) 길눈 2.28.0 — 길눈 목소리(마이크로소프트 선희)
# 1.5.8 (261001-4, 대표님 승인) 길눈 2.27.0 — 새 알아듣기 부품(SpeechAnalyzer)
# 1.5.7 (261001-3, 대표님 승인) 길눈 2.26.0 — 하이 길눈 대화 흐름
# 1.5.6 (261001-2, 대표님 승인) 길눈 2.25.0 — 차 안 간판 알림
# 1.5.5 (261001-1, 대표님 승인) 길눈 2.24.0 — 발 앞 계단·턱 알림(관리자 시험)
# 1.5.4 (260930-10, 대표님 승인) 길눈 2.23.0 — 인터넷 없이 한마디 설명
# 1.5.3 (260930-9, 대표님 승인) 길눈 2.22.0 — 빛 알아보기
# 1.5.2 (260930-8, 대표님 승인) 길눈 2.21.0 — 지폐와 색깔 알아보기
# 1.5.1 (260930-7, 대표님 승인) 길눈 2.20.0 — 상품 바코드 읽기, QR 찾기·안면인식도 카메라 한 곳만
# 1.5.0 (260930-6, 이사장님 승인) AI점자도서관 앱(kr.or.ada.lib)을 한 저장소에 넣음. 소스는 Lib 폴더, 회원 열쇠로만 나스에 들어감.
# 한 저장소에 세 앱을 담습니다. 짓기 설정(build.yml)에서 어느 앱을 지을지 골라 씁니다.
#   AdaApp     협회 앱  (kr.or.ada.app)     대문 https://lvd.ada.or.kr/app/     + 애플워치
#   JabongApp  자봉 앱  (kr.or.ada.jabong)  대문 https://lvd.ada.or.kr/jabong/
#   BfbApp     배프 앱  (kr.or.ada.bfb)     대문 https://lvd.ada.or.kr/bfb/
#   LibApp     AI점자도서관 (kr.or.ada.lib)  Lib 폴더의 자체 코드, iOS 17 이상
# 배프 앱만 App 폴더의 소스를 씁니다(협회 앱·자봉 앱은 속까지 앱). 대문 주소는 각자 Info.plist 의 AdaHomeURL 로 갈라집니다.
name: AdaApp
options:
  bundleIdPrefix: kr.or.ada
  developmentLanguage: ko   # 260926-2 허락 창·단추가 영어로 나오던 것 — 앱 기본 말을 한국어로
  deploymentTarget:
    iOS: "16.4"
    watchOS: "9.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  WebRTC:                       # 2.4.0 (260928-5) 길눈 긴급통화서비스의 앱 자체 화상통화 — 구글 WebRTC 공개 부품
    url: https://github.com/stasel/WebRTC
    exactVersion: "153.0.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "260923001"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AdaApp:
    # 2.0.0 (빌드 260928-1, 2026-09-28 이사장님 지시) 길눈은 속까지 앱으로 — 웹을 띄우던 App 폴더 대신 Gilnun 폴더의 자체 코드로 짓습니다.
    # 자봉 앱·배프 앱은 App 폴더를 그대로 씁니다.
    type: application
    platform: iOS
    sources:
      - path: Gilnun
      - path: App/Assets.xcassets
    dependencies:
      - target: AdaWatch
        embed: true
      - package: WebRTC
    info:
      path: Gilnun/Info.plist
      properties:
        CFBundleDisplayName: 길눈
        CFBundleName: AdaApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification, bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.or.ada.app.gongji]
        LSSupportsOpeningDocumentsInPlace: false   # 1.6.9 받은 동영상은 길눈 보관함으로 옮겨 틂
        CFBundleDocumentTypes:   # 1.6.9 카톡·문자·사진에서 공유 → 길눈으로 동영상 받기(길눈은 다른 앱 다음 차례로만 나섬)
          - CFBundleTypeName: 동영상
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.avi]
        NSLocationWhenInUseUsageDescription: 길눈이 걷는 동안 방향과 남은 거리를 안내하려면 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 폰이 주머니에 있어도 갈림길 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 라이브 현장영상해설 방송과 시지각 판독, 사진 읽어 주기와 안면인식, QR 찾기, 문 찾기, 즉석 글자 읽기, 가리키고 말하기, 사람 감지, 상품 바코드 읽기, 지폐와 색깔 알아보기, 빛 알아보기, 한마디 설명, 발 앞 계단·턱 알림(폰 안에서만)에 카메라를 씁니다.
        NSMicrophoneUsageDescription: 길눈을 말로 시키고 목적지·역 이름을 말로 넣는 데, 그리고 라이브 현장영상해설 방송에 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말씀하신 목적지와 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다. 받아쓰기는 폰 안에서 합니다.
        NSBluetoothAlwaysUsageDescription: 길가의 음성유도기와 음향신호기를 켜는 데 블루투스를 씁니다.
        NSMotionUsageDescription: 점지도를 따라 걸을 때 걸음과 몸이 돈 방향을 재어 걸음마다 확신음을 내고 위성이 끊겨도 걸음으로 안내를 이어 가는 데, 되짚어 나가기로 건물 안에서 걸은 길을 기억하는 데, 말로 그린 길에서 걸음을 곧바로 세는 데, 보폭 재기와 폰을 흔들어 긴급통화 열기에 움직임 정보를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/AdaApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.54.0"   # 261007-I5 새 판 알림(이사장님 승인)
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]   # 1.6.0 옛 폰에서도 앱이 열리게 약하게 잇기
  JabongApp:
    # 2.0.0 (빌드 261001-7, 2026-10-01 대표님 승인) 자봉 앱도 속까지 앱으로 — 웹을 띄우던 App 폴더 대신
    # 길눈 부품 폴더(Gilnun)를 통째로 함께 싣고, 시작 파일만 자봉 것(Jabong/JabongApp.swift)으로 바꿉니다.
    type: application
    platform: iOS
    sources:
      - path: Gilnun
        excludes:
          - GilnunApp.swift
          - GilnunIntent.swift
          - Info.plist
      - path: Jabong
        excludes:
          - MomSensor.swift   # 1.6.7 몸 센서는 Gilnun/MomSensor.swift 로 옮김(같은 이름 두 벌 막기)
    dependencies:
      - package: WebRTC
    info:
      path: Jabong/Info.plist
      properties:
        CFBundleDisplayName: 자봉
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleName: JabongApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AdaHomeURL: https://lvd.ada.or.kr/jabong/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification, voip]   # 2.1.0 긴급통화가 전화처럼 울리게
        NSLocationWhenInUseUsageDescription: 도움을 청한 분이 계신 곳까지 찾아가는 데 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 봉사 가는 길에 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 도움을 청한 분과 화상으로 이어 현장을 살피는 데 카메라를 씁니다.
        NSMicrophoneUsageDescription: 도움을 청한 분과 말을 주고받고, 점지도 표시마다 그 자리 모습을 짧게 말로 남기는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 하시는 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다.
        NSMotionUsageDescription: 점지도를 그릴 때 걸음, 몸이 돈 방향, 오르내림과 멈춤을 재는 데 움직임 정보를 씁니다.
        NSBluetoothAlwaysUsageDescription: 길가의 음성유도기와 음향신호기를 켜는 데 블루투스를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Jabong/JabongApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.jabong
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.12.0"   # 261007-I6 새 판 알림(이사장님 승인). 261007-I4 봉사자 요청 여섯 가지(계단 여쭙기 없앰·말로 자유 표시·올리기·지우기·출발지 도착지 이름·안내 말소리 끄기, 이사장님 승인). 261007-I3 방향은 늘 시계 방향으로(이사장님 지시). 261007-I1 점지도 일곱 가지 약속·확인 문제 아홉 개(이사장님 승인)
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]   # 길눈 부품과 같이 옛 폰에서도 열리게
  BfbApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Assets.xcassets
          - Info.plist
          - AdaApp.entitlements
      - path: Bfb
    info:
      path: Bfb/Info.plist
      properties:
        CFBundleDisplayName: 배프
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleName: BfbApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AdaHomeURL: https://lvd.ada.or.kr/bfb/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, remote-notification]
        NSCameraUsageDescription: 현장에서 라이브 방송을 내보내는 데 카메라를 씁니다.
        NSMicrophoneUsageDescription: 현장에서 라이브 해설을 내보내는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 하시는 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다.
        NSLocationWhenInUseUsageDescription: 현장 방송을 내보낼 때 어디서 하는 방송인지 알리는 데 위치를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Bfb/BfbApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.bfb
        TARGETED_DEVICE_FAMILY: "1"
  LibApp:
    # 0.2.0 (261002-1/261003-1) 디자인 바탕(남색·금빛, 법인 로고, 표지)·내 서재 새로(15권씩, 지우기·되돌리기, 다 읽은 책)
    # 0.1.0 (260930-6) AI점자도서관 앱 — 도서관, 내 서재, 설정·도움말 세 탭과 독서기
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lib
    info:
      path: Lib/Info.plist
      properties:
        CFBundleDisplayName: AI점자도서관
        CFBundleName: LibApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.lib
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.4.2"   # 261006-6 책 소개·지은이·출판사, 책 소개 듣기. 261006-5 여섯 문단 미리 받기(소리 멈춤 줄이기). 261006-4 목소리 열 가지·미리 듣기, 재생 위치 막대, 앞으로 30초와 뒤로 30초(이사장님 지시). 261006-3 인터넷이 될 때는 늘 도서관(서버) 목소리, 폰 목소리는 인터넷이 끊겼을 때만(이사장님 지적). 261006-2 세 겹의 문 목록 고침·탭 고르면 맨 위로·독서기 떠나면 멈춤(도서관 창 클, 이사장님 지적)
  AdaWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 길눈
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: kr.or.ada.app
        WKWatchOnly: false
        NSLocationWhenInUseUsageDescription: 내 자리를 알려 드리는 데 위치를 씁니다.
        NSBluetoothAlwaysUsageDescription: 음성유도기를 켜는 데 블루투스를 씁니다.
