# 1.5.0 (260930-6, 이사장님 승인) AI점자도서관 앱(kr.or.ada.lib)을 한 저장소에 넣음. 소스는 Lib 폴더, 회원 열쇠로만 나스에 들어감.
# 한 저장소에 세 앱을 담습니다. 짓기 설정(build.yml)에서 어느 앱을 지을지 골라 씁니다.
#   AdaApp     협회 앱  (kr.or.ada.app)     대문 https://lvd.ada.or.kr/app/     + 애플워치
#   JabongApp  자봉 앱  (kr.or.ada.jabong)  대문 https://lvd.ada.or.kr/jabong/
#   BfbApp     LVD 방송 (kr.or.ada.bfb)  Bfb 폴더의 자체 코드 — 듣는 앱(행사장 현장영상해설·배리어프리방송국), 261015 배프 웹 껍데기에서 바뀜
#   LibApp     AI점자도서관 (kr.or.ada.lib)  Lib 폴더의 자체 코드, iOS 17 이상
#   TourApp    LVD투어스튜디오 (kr.or.ada.tourstudio)  Tour 폴더의 자체 코드, iOS 17 이상
#   ByodApp    LVD 송출 (kr.or.ada.byod)  Byod 폴더의 자체 코드(261015 BYOD 방송에서 이름 바뀜) — 현장영상해설을 같은 공유기의 폰들에 나눠 보냄(안드로이드 BYOD와 같은 방식)
# 261015 배프 앱(BfbApp)은 듣는 앱 「LVD 방송」 속까지 앱(Bfb 폴더)으로 바뀌어 App 폴더를 쓰지 않습니다.
name: AdaApp
options:
  bundleIdPrefix: kr.or.ada
  developmentLanguage: ko   # 260926-2 허락 창·단추가 영어로 나오던 것 — 앱 기본 말을 한국어로
  deploymentTarget:
    iOS: "16.4"
    watchOS: "9.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  WebRTC:                       # 2.4.0 (260928-5) 길눈 긴급통화서비스의 앱 자체 화상통화 — 구글 WebRTC 공개 부품
    url: https://github.com/stasel/WebRTC
    exactVersion: "153.0.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "260923001"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AdaApp:
    # 2.0.0 (빌드 260928-1, 2026-09-28 이사장님 지시) 길눈은 속까지 앱으로 — 웹을 띄우던 App 폴더 대신 Gilnun 폴더의 자체 코드로 짓습니다.
    # 자봉 앱·배프 앱은 App 폴더를 그대로 씁니다.
    type: application
    platform: iOS
    sources:
      - path: Gilnun
      - path: App/Assets.xcassets
    dependencies:
      - target: AdaWatch
        embed: true
      - package: WebRTC
    info:
      path: Gilnun/Info.plist
      properties:
        CFBundleDisplayName: 길눈
        CFBundleName: AdaApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification, bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.or.ada.app.gongji]
        LSSupportsOpeningDocumentsInPlace: false   # 1.6.9 받은 동영상은 길눈 보관함으로 옮겨 틂
        CFBundleDocumentTypes:   # 1.6.9 카톡·문자·사진에서 공유 → 길눈으로 동영상 받기(길눈은 다른 앱 다음 차례로만 나섬)
          - CFBundleTypeName: 동영상
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.avi]
        NSLocationWhenInUseUsageDescription: 길눈이 걷는 동안 방향과 남은 거리를 안내하려면 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 폰이 주머니에 있어도 갈림길 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 라이브 현장영상해설 방송과 시지각 판독, 사진 읽어 주기와 안면인식, QR 찾기, 문 찾기, 즉석 글자 읽기, 가리키고 말하기, 사람 감지, 상품 바코드 읽기, 지폐와 색깔 알아보기, 빛 알아보기, 한마디 설명, 발 앞 계단·턱 알림(폰 안에서만)에 카메라를 씁니다.
        NSMicrophoneUsageDescription: 길눈을 말로 시키고 목적지·역 이름을 말로 넣는 데, 그리고 라이브 현장영상해설 방송에 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말씀하신 목적지와 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다. 받아쓰기는 폰 안에서 합니다.
        NSBluetoothAlwaysUsageDescription: 길가의 음성유도기와 음향신호기를 켜는 데 블루투스를 씁니다.
        NSMotionUsageDescription: 점지도를 따라 걸을 때 걸음과 몸이 돈 방향을 재어 걸음마다 확신음을 내고 위성이 끊겨도 걸음으로 안내를 이어 가는 데, 되짚어 나가기로 건물 안에서 걸은 길을 기억하는 데, 말로 그린 길에서 걸음을 곧바로 세는 데, 보폭 재기와 폰을 흔들어 긴급통화 열기에 움직임 정보를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/AdaApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.100.0"   # 261018-I54 동영상 강의 — 길눈 사용법 26편을 앱 안에서, 도움말 항목마다 그 기능의 강의, 이름 없는 조회수(이사장님 승인 2026-10-18 「1」). 261018-I53 기차 안내 선로 맞추기 — 타신 선로 앞의 터널·다음 역만, 서는 역 전체, 기차 위치 기록(이사장님 승인 2026-10-17 「1」). 261017-I52 기차 안내 — 역을 지난다는 말은 실제로 지난 뒤에만, 여정 시험 통과(이사장님 승인 2026-10-17). 261017-I51 기차 안내 바로잡음 — 내릴 역은 한 곳만, 서지 않는 역에서 멈춤, 다른 노선 터널 거름(이사장님 KTX에서 겪으심 2026-10-17). 261017-I50 안내가 소리 없이 멈추던 것 바로잡음 — 소리 자리를 빼앗긴 뒤 말 줄 막힘 풀기(이사장님 KTX에서 겪으심 2026-10-17). 261017-I49 웹 길눈에서 옮긴 것 4단계 — 미리 걸어 보기(이사장님 승인 2026-10-17). 261017-I48 웹 길눈에서 옮긴 것 3단계 — 긴급통화 내 자리 보내기, 「집에 가자」·「사무실 가자」로 말로 그린 길 바로 시작(이사장님 승인 2026-10-17). 261017-I47 웹 길눈에서 옮긴 것 2단계 — 교통편, 섬으로 가기·타기 전에 챙길 것, 지금 시각·지하철 고장, 자동 입력, 요즘 찾으신 곳(이사장님 승인 2026-10-17). 261017-I46 웹 길눈에서 옮긴 것 1단계 — 차 안 터널·크게 돌 때·멈춘 까닭, 지하철 다음 열차, 지난 여정 여쭙기, 교통 상황 시간, 길 자료 미리 받기(이사장님 승인 2026-10-17). 261017-I45 기차 안내 — 역 도착·떠남·지나감·내릴 역, 터널 미리 알림, 열차 시간표로 도착 예정(이사장님 승인 2026-10-17). 261017-I44 탈것 고르기 — 기차로 가기·배로 가기, 탈것 바꾸기 한 줄로 접고 부르면 펼침(이사장님 승인 2026-10-17). 261017-I43 음악·방송 탭 손질·둘러보기 네 가지(이사장님 승인 2026-10-17). 261016-I42 둘러보기 — 현장영상해설 받기 줄 감춤·말로 하면 긴급통화로 요청, 카메라 눈 말 줄이기, 도움말(이사장님 승인 2026-10-16). 261016-I41 그 밖에 펼치기 손질·음향신호기 블루투스 알림·되짚어 나가기 단추 통일·도움말 바로잡음(이사장님 승인 2026-10-16). 261016-I40 긴급통화서비스 손질·가족·지인 별명(이사장님 승인 2026-10-16). 261016-I39 말로 하기 — 안드로이드와 같게·도움말 바로잡음(이사장님 승인 2026-10-16). 261016-I38 지금 내 자리 듣기 — 안드로이드와 같게(이사장님 승인 「1」). 261016-I37 차 부르기 — 안드로이드와 같게(이사장님 승인 「2」). 261016-I36 버스로 가기 화면 제목·버스 안 안내 단추 — 안드로이드와 같게(이사장님 승인 「1」). 261016-I35 자봉 그리기 탭 이름 따라 안내 바로잡음(이사장님 지시). 261016-I34 긴급통화 가족·지인 40초·이음 번호 세 자리·열 분까지 — 안드로이드와 같게(이사장님 승인 「1」). 261015-I33 지하철로 가기 화면 제목 — 안드로이드와 같게(이사장님 승인). 261015-I32 점지도 길 고르기·점지도 안내 설정·다시 듣기 — 안드로이드와 같게(이사장님 승인). 261015-I31 차 안 안내 100·30미터·내리면 점지도 확인·부른 콜 이름·차 부르기 네로 전화(이사장님 승인 「1」). 261015-I30 새 목적지면 문까지 이끌기 멈춤·걷는 안내 도움말 — 안드로이드와 같게(이사장님 승인 「1」). 261015-I29 찾은 곳·목적지 화면 제목 — 안드로이드와 같게(이사장님 승인). 261014-I28 차 부르기 「다른 수단 펼치기」 이름 — 안드로이드와 같게(이사장님 승인). 261014-I27 음향신호기 찾기 멈추기·긴급통화 글자·멈추기에 말로 그린 길 — 안드로이드와 같게(이사장님 승인). 261014-I26 음향신호기 위치 안내 단추·위치 허락 안내 — 안드로이드와 같게(이사장님 승인). 261014-I25 도움말 길 찾기 첫 화면 차례(이사장님 승인 「1」). 261014-I24 설정 탭 차례를 한 잣대로(이사장님 승인 「1」). 261014-I23 길 부탁 출발지·도착지는 고른 건물·가게 이름으로만(직원 시험 뒤 이사장님 지시). 261014-I22 지금 내 자리 출구 호선 뺌·두 출구 사이·버스정류장 이름과 번호·콜 상담원께 타는 곳·자리 말 기록(이사장님 승인). 261013-I21 막힘 판단 바로잡음·전철역만 말하면 어디까지 여쭘·멀어지면 알림·통화 뒤 다시 여쭘·콜 차 버스로 안 바꿈(이사장님 승인). 261013-I20 말로 하기 막힘 풀기·협회 목소리 미리 받기·도착 뒤 문까지 이끌기·음악 다시 잇기·기록 이름(이사장님 승인 「그래」). 261012-I19 「무엇을 타고 계신가요」 물음 — 차·걷기 넣음, 걷는 차례에도 보임(이사장님 지시). 261011-I18 기차 알아보기·기차와 배 지킴·바로잡기 단추 꺼냄·배(선박) 넣음·바다 위 지금 자리·내리셨는지 여쭘·빠를 때 간판 쉼·터널 땅속 아님·마이크 다시 잡기(이사장님 승인 「1」). 261010-I17 낙상 주의 겹 감시·길 폭·되돌아가는 곳, 점지도 따라 걷기를 걸음 바탕으로 — 그린 이 걸음×보폭 거리·내 보폭 비교, 좌우 한 걸음은 걸음과 방향으로, 돌아섬 알림·남은 걸음 늘어남, 자리·말 기록(이사장님 승인 「1」). 261010-I16 고장 노래 저절로 틀기 한 번 끔으로 되돌림·이어 들을 때도 네(이사장님 승인). 261009-I15 탈것 바로잡기 단추·콜 못 박기 풂·땅속 판단·전화 중 마이크·엄격한 네 아니오·긴급통화 거절 알림·한 폰 표·점지도 탈것 구간(이사장님 승인). 261009-I14 목적지 바꾸기 전 여쭘·한 마디 거름·콜 다시 걸기 막음·콜 배차 뒤 차 못 박기·차 안 안내 바로잡기·편집 중 화면 굳히기(이사장님 승인). 261009-I13 전화 오거나 걸면 모든 소리 멈춤·방송 이어 듣기, 땅속 판단·지역 찾기·탈것 기록 바로잡음, 자봉 점지도 잇기 점검, 아침 기록(이사장님 승인). 261009-I12 차 부르기·정기 호출·이용 기록(이사장님 승인). 261008-I11 차에 타면 고장 노래 저절로 틀기 처음값 끔(이사장님 지시). 261007-I10 차 안 길 맞춤·안내 정도(이사장님 허락), 보기 문장 시계 방향. 261007-I9 목소리 따라 걷기(이사장님 확정 방식). 261007-I5 새 판 알림(이사장님 승인)
