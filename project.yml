# 1.5.0 (260930-6, 이사장님 승인) AI점자도서관 앱(kr.or.ada.lib)을 한 저장소에 넣음. 소스는 Lib 폴더, 회원 열쇠로만 나스에 들어감.
# 한 저장소에 세 앱을 담습니다. 짓기 설정(build.yml)에서 어느 앱을 지을지 골라 씁니다.
#   AdaApp     협회 앱  (kr.or.ada.app)     대문 https://lvd.ada.or.kr/app/     + 애플워치
#   JabongApp  자봉 앱  (kr.or.ada.jabong)  대문 https://lvd.ada.or.kr/jabong/
#   BfbApp     LVD 방송 (kr.or.ada.bfb)  Bfb 폴더의 자체 코드 — 듣는 앱(행사장 현장영상해설·배리어프리방송국), 261015 배프 웹 껍데기에서 바뀜
#   LibApp     AI점자도서관 (kr.or.ada.lib)  Lib 폴더의 자체 코드, iOS 17 이상
#   TourApp    LVD투어스튜디오 (kr.or.ada.tourstudio)  Tour 폴더의 자체 코드, iOS 17 이상
#   SueopApp   LVD 수업 (kr.or.ada.sueop)  Sueop 폴더의 자체 코드(261020) — 교육생 폰에서 강사님 수업 자료를 그대로 봄
#   ByodApp    LVD 송출 (kr.or.ada.byod)  Byod 폴더의 자체 코드(261015 BYOD 방송에서 이름 바뀜) — 현장영상해설을 같은 공유기의 폰들에 나눠 보냄(안드로이드 BYOD와 같은 방식)
# 261015 배프 앱(BfbApp)은 듣는 앱 「LVD 방송」 속까지 앱(Bfb 폴더)으로 바뀌어 App 폴더를 쓰지 않습니다.
# 2026-10-21 (261021-SG1, 이사장님 승인 「그래」, 대클) 앱마다 설계도를 따로 — 한 클이 하다 만 일이 다른 앱 짓기를 막지 않게.
# ★이제 이 파일에는 앱 설정이 없습니다. 앱마다 따로 된 설계도를 고치십시오.
#   seolgye_gongtong.yml  모든 앱이 함께 쓰는 설정
#   seolgye_gilnun.yml    길눈(AdaApp)·자봉(JabongApp)·애플워치(AdaWatch)
#   seolgye_bfb.yml       LVD 방송(BfbApp)
#   seolgye_lib.yml       AI점자도서관(LibApp)
#   seolgye_tour.yml      LVD투어스튜디오(TourApp)
#   seolgye_byod.yml      LVD 송출(ByodApp)
#   seolgye_sueop.yml     LVD 수업(SueopApp)
# 이 파일은 맥에서 모든 앱을 한꺼번에 열어 볼 때만 씁니다(자동 짓기는 쓰지 않음).
name: AdaApp
include:
  - seolgye_gilnun.yml
  - seolgye_bfb.yml
  - seolgye_lib.yml
  - seolgye_tour.yml
  - seolgye_byod.yml
  - seolgye_sueop.yml
