# 협회 앱 · 자봉 앱 · 배프 앱 · AI점자도서관 — XcodeGen 설계도 (1.5.1판, 빌드 260930-7 — 길눈 2.20.0 상품 바코드 읽기(카메라 눈 묶음 5))
# 1.5.1 (260930-7, 대표님 승인) 길눈 2.20.0 — 상품 바코드 읽기, QR 찾기·안면인식도 카메라 한 곳만
# 1.5.0 (260930-6, 이사장님 승인) AI점자도서관 앱(kr.or.ada.lib)을 한 저장소에 넣음. 소스는 Lib 폴더, 회원 열쇠로만 나스에 들어감.
# 한 저장소에 세 앱을 담습니다. 짓기 설정(build.yml)에서 어느 앱을 지을지 골라 씁니다.
#   AdaApp     협회 앱  (kr.or.ada.app)     대문 https://lvd.ada.or.kr/app/     + 애플워치
#   JabongApp  자봉 앱  (kr.or.ada.jabong)  대문 https://lvd.ada.or.kr/jabong/
#   BfbApp     배프 앱  (kr.or.ada.bfb)     대문 https://lvd.ada.or.kr/bfb/
#   LibApp     AI점자도서관 (kr.or.ada.lib)  Lib 폴더의 자체 코드, iOS 17 이상
# 두 앱은 App 폴더의 소스를 함께 씁니다. 대문 주소는 각자 Info.plist 의 AdaHomeURL 로 갈라집니다.
name: AdaApp
options:
  bundleIdPrefix: kr.or.ada
  developmentLanguage: ko   # 260926-2 허락 창·단추가 영어로 나오던 것 — 앱 기본 말을 한국어로
  deploymentTarget:
    iOS: "16.4"
    watchOS: "9.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  WebRTC:                       # 2.4.0 (260928-5) 길눈 긴급통화서비스의 앱 자체 화상통화 — 구글 WebRTC 공개 부품
    url: https://github.com/stasel/WebRTC
    exactVersion: "153.0.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "260923001"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AdaApp:
    # 2.0.0 (빌드 260928-1, 2026-09-28 이사장님 지시) 길눈은 속까지 앱으로 — 웹을 띄우던 App 폴더 대신 Gilnun 폴더의 자체 코드로 짓습니다.
    # 자봉 앱·배프 앱은 App 폴더를 그대로 씁니다.
    type: application
    platform: iOS
    sources:
      - path: Gilnun
      - path: App/Assets.xcassets
    dependencies:
      - target: AdaWatch
        embed: true
      - package: WebRTC
    info:
      path: Gilnun/Info.plist
      properties:
        CFBundleDisplayName: 길눈
        CFBundleName: AdaApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification, bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.or.ada.app.gongji]
        NSLocationWhenInUseUsageDescription: 길눈이 걷는 동안 방향과 남은 거리를 안내하려면 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 폰이 주머니에 있어도 갈림길 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 라이브 현장영상해설 방송과 시지각 판독, 사진 읽어 주기와 안면인식, QR 찾기, 문 찾기, 즉석 글자 읽기, 가리키고 말하기, 사람 감지, 상품 바코드 읽기(폰 안에서만)에 카메라를 씁니다.
        NSMicrophoneUsageDescription: 길눈을 말로 시키고 목적지·역 이름을 말로 넣는 데, 그리고 라이브 현장영상해설 방송에 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말씀하신 목적지와 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다. 받아쓰기는 폰 안에서 합니다.
        NSBluetoothAlwaysUsageDescription: 길가의 음성유도기와 음향신호기를 켜는 데 블루투스를 씁니다.
        NSMotionUsageDescription: 점지도를 따라 걸을 때 걸음마다 확신음을 내고 위성이 끊겨도 걸음으로 안내를 이어 가는 데, 되짚어 나가기로 건물 안에서 걸은 길을 기억하는 데, 말로 그린 길에서 걸음을 곧바로 세는 데, 보폭 재기와 폰을 흔들어 긴급통화 열기에 움직임 정보를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/AdaApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.20.0"
  JabongApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Assets.xcassets
          - Info.plist
          - AdaApp.entitlements
      - path: Jabong
    info:
      path: Jabong/Info.plist
      properties:
        CFBundleDisplayName: 자봉
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleName: JabongApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AdaHomeURL: https://lvd.ada.or.kr/jabong/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, remote-notification]
        NSLocationWhenInUseUsageDescription: 도움을 청한 분이 계신 곳까지 찾아가는 데 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 봉사 가는 길에 안내를 이어 가려면 항상 위치가 필요합니다.
        NSCameraUsageDescription: 도움을 청한 분과 화상으로 이어 현장을 살피는 데 카메라를 씁니다.
        NSMicrophoneUsageDescription: 도움을 청한 분과 말을 주고받는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 하시는 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다.
        NSMotionUsageDescription: 걸음 수 재기에 움직임 정보를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Jabong/JabongApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.jabong
        TARGETED_DEVICE_FAMILY: "1"
  BfbApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Assets.xcassets
          - Info.plist
          - AdaApp.entitlements
      - path: Bfb
    info:
      path: Bfb/Info.plist
      properties:
        CFBundleDisplayName: 배프
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleName: BfbApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AdaHomeURL: https://lvd.ada.or.kr/bfb/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, remote-notification]
        NSCameraUsageDescription: 현장에서 라이브 방송을 내보내는 데 카메라를 씁니다.
        NSMicrophoneUsageDescription: 현장에서 라이브 해설을 내보내는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 하시는 명령을 글자로 알아듣는 데 아이폰 받아쓰기를 씁니다.
        NSLocationWhenInUseUsageDescription: 현장 방송을 내보낼 때 어디서 하는 방송인지 알리는 데 위치를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Bfb/BfbApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.bfb
        TARGETED_DEVICE_FAMILY: "1"
  LibApp:
    # 0.1.0 (260930-6) AI점자도서관 앱 — 도서관, 내 서재, 설정·도움말 세 탭과 독서기
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lib
    info:
      path: Lib/Info.plist
      properties:
        CFBundleDisplayName: AI점자도서관
        CFBundleName: LibApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.lib
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
  AdaWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 길눈
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: kr.or.ada.app
        WKWatchOnly: false
        NSLocationWhenInUseUsageDescription: 내 자리를 알려 드리는 데 위치를 씁니다.
        NSBluetoothAlwaysUsageDescription: 음성유도기를 켜는 데 블루투스를 씁니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "2.20.0"   # 워치 판은 폰 길눈 판과 같아야 올라감
schemes:
  AdaApp:
    build:
      targets:
        AdaApp: all
    archive:
      config: Release
  JabongApp:
    build:
      targets:
        JabongApp: all
    archive:
      config: Release
  BfbApp:
    build:
      targets:
        BfbApp: all
    archive:
      config: Release
  LibApp:
    build:
      targets:
        LibApp: all
    archive:
      config: Release
