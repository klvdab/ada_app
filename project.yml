        MARKETING_VERSION: "0.8.1"   # 261018-L20 곡이 넘어갈 때 제목 읽기 켜기·끄기를 듣는 화면에서 설정으로 옮김(이사장님 승인 「3」). 261018-L19 엔터테인먼트 이어 듣기·이어 보기 — 곡·회가 끝나면 다음 것 저절로(서버 enter.php m=daeum), 듣는 방식 다섯(앨범·작품 끝까지, 갈래 전체, 섞어 듣기, 한 곡 반복, 한 곡만), 앞 곡·다음 곡 단추와 이어폰·잠금 화면 다음 곡, 넘어갈 때 이름 한 번 알림, 다음 곡 미리 받기, 도움말 「음악·드라마 이어 듣기」(도클, 이사장님 지시 2026-10-18 12시 47분·승인 「1」). 261016-L18 엔터테인먼트 여덟 갈래 모두 열림·영상 작품은 화면과 함께(서버가 영상인지 알려 줌), 첫 화면 제목 「갈래」, 도움말 「영상 보기」(도클, 이사장님 승인 2026-10-16 2시 21분 「1」). 261014-L17 탭을 고르면 커서를 목록 첫 줄에(길눈처럼), 책 듣기 멈춤 줄이기 — 미리 받기를 세 문단 차례로·지금 문단 먼저·묻기 줄이기·멀어진 미리 받기 그만둠, 도움말 「탭 고르기」(도서관 창 클, 이사장님 지시 23시 4분·승인 23시 17분 「1」). 261014-L16 엔터테인먼트 탭(나스 AI문화관의 공개 갈래 — 첫 갈래 화면해설 작품, 이어 듣기·찾기·도움말 — 도서관 창 클, 이사장님 승인 「1」·「2」). 261014-L15 기다림 알리기(10초·45초 한 번씩, 4분까지 기다림), 이용 기록(앱 판·막힌 일을 협회 서버에, 이름·전화·책은 남기지 않음 — 도서관 창 클, 이사장님 승인 「1」·「그래」, 도움말·등록 화면 알림). 261012-L14 사전 도움말에 우리말샘·한국고전종합DB, 한자음 읽기 도움말에 경서 읽는 소리(도서관 창 클, 이사장님 승인 「1」). 261012-L13 한자음 읽기(중국 고전을 우리 한자음으로, 간체자도, 원문 함께 보기 — 도서관 창 클, 이사장님 승인 「1」). 261012-L12 곱씹어 읽기(다시 듣기·풀어 읽기·중요 표시·책 속 찾기)와 사전·내 낱말장(도서관 창 클, 이사장님 승인 「1」). 261012-L11 외국 도서 문(외국 도서 → 언어 → 장르와 주제), 글 판 4(강제 줄바꿈 바로잡은 글·옛 자리 옮기기), 도움말 둘(도서관 창 클, 이사장님 승인 「1」). 261010-L10 첫 화면 맨 위 이름 줄·바로 아래 찾기 칸, 목록에서 한 번 두드리면 바로 읽기, 넘긴 뒤 커서를 첫 줄로(도서관 창 클, 이사장님 승인 「1」). 261010-L9 첫 화면에 고른 문의 서가 목록·형태별 갈래와 보일 책 뺌·세 손가락 쓸기로 목록 넘기기(도서관 창 클, 이사장님 승인 「1」). 261007-L7 새 판 알림(대장클, 이사장님 지시). 261006-6 책 소개·지은이·출판사, 책 소개 듣기. 261006-5 여섯 문단 미리 받기(소리 멈춤 줄이기). 261006-4 목소리 열 가지·미리 듣기, 재생 위치 막대, 앞으로 30초와 뒤로 30초(이사장님 지시). 261006-3 인터넷이 될 때는 늘 도서관(서버) 목소리, 폰 목소리는 인터넷이 끊겼을 때만(이사장님 지적). 261006-2 세 겹의 문 목록 고침·탭 고르면 맨 위로·독서기 떠나면 멈춤(도서관 창 클, 이사장님 지적)
  TourApp:
    # 1.0.0 (261012-T1, 2026-10-12 이사장님 승인 「1」) LVD투어스튜디오 — 웹 투어스튜디오 1.12판을 속까지 앱으로(Tour 폴더), iOS 17 이상
    # 탭 다섯: 코스·답사·지점·현장영상해설·설정. 서버는 웹과 같은 lvdts_api.php
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tour
    info:
      path: Tour/Info.plist
      properties:
        CFBundleDisplayName: 투어스튜디오
        CFBundleName: TourApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: 답사 때 지점의 정지 현장영상해설 자리에서 시계 방향 네 쪽 사진을 찍는 데 카메라를 씁니다.
        NSLocationWhenInUseUsageDescription: 답사 때 지점이 시작되고 끝나는 자리와 지점 사이 걸은 거리(이동 시간)를 적는 데 위치를 씁니다.
        NSMicrophoneUsageDescription: 답사 때 현장 메모를 말로 적고, 대본을 읽으며 연습 녹음을 하는 데 마이크를 씁니다.
        NSSpeechRecognitionUsageDescription: 말로 적은 현장 메모와 연습 녹음을 글로 옮기고, 말하는 대로 대본을 쓰는 데 받아쓰기를 씁니다.
        NSPhotoLibraryAddUsageDescription: 답사 사진을 사진 앱에 저장하는 데 씁니다.
        NSMotionUsageDescription: 답사 때 지점 사이를 걸으며 걸음 수와 계단·오르막을 재어 이동 구간 안내 초안을 쓰는 데 동작과 기압 센서를 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.tourstudio
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.4.0"   # 261018-T6 말로 대본 쓰기(받아쓰기를 바로 대본으로), 이어폰 한 번 누름을 대본 받아쓰기로(방클, 이사장님 「1」). 1.3.0 261018-T5 앱만 할 수 있는 것 — 이어폰 단추로 답사, 걸으며 저절로 재기, 판 기록(방클, 이사장님 승인 1·2·8번). 1.2.0 261017-T4 웹에 있는 기능 모두 — 관리자 일·내보내기·협회 승인·원칙 16개·평면도·답사 지도·사전·장소 지식·승인본 현장영상해설 화면·저절로 찍기·벗어남 알림(방클, 이사장님 지시 「웹에 있는 모든 기능을 겉과 속이 같게」). 1.1.0 261017-T3 웹에 있던 것 열네 가지 — 사진 크게 보기·지우기·다시 찍기, 지점 지우기, 현장 메모(말·글)와 듣기, 읽으며 녹음과 되돌아보기(mp3), 못 올린 것 다시 올리기, 봐 달라고 알리기, 판 되돌리기, 코스 지우기·휴지통, 더 적을 것(방클, 이사장님 승인 「첫단계부터 시작해」). 261014-T2 사진 안내 시계 방향·네 개씩 목록 「넷」·도움말 뒤로 단추 자리(이사장님 승인 「1」). 261012-T1 첫 판 — 코스·답사(지점 경계·새 지점·시계 방향 사진)·지점 한 화면·현장영상해설·원칙 16개 점검·승인 요청·저절로 저장(이사장님 승인 「1」)
  ByodApp:
    # 1.1.5 (261010-BI1, 2026-10-10 이사장님 승인 「아이폰용도 진행」, 방송클) BYOD 방송 아이폰 — 안드로이드 BYOD 방송 1.1.5와 같은 기능
    # 화면을 잠가도 해설 소리 받기와 나눠 보내기가 이어지도록 뒤에서 소리(audio), 엔에프시 스티커 쓰기(TAG)
    type: application
    platform: iOS
    sources:
      - path: Byod
    info:
      path: Byod/Info.plist
      properties:
        CFBundleDisplayName: LVD 송출
        CFBundleName: ByodApp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIRequiresPersistentWiFi: true
        NSMicrophoneUsageDescription: 현장영상해설사의 해설 소리(수신기 선을 꽂은 사운드카드나 아이폰 마이크)를 받아 같은 공유기에 붙은 듣는 분 폰들과 인터넷 방송으로 보내고, 현장영상해설교육을 녹화하는 데 마이크를 씁니다.
        NSCameraUsageDescription: 현장영상해설교육을 영상으로 녹화하는 데 카메라를 씁니다.
        NSLocalNetworkUsageDescription: 같은 공유기에 붙은 듣는 분 폰들에 현장영상해설을 보내는 데 로컬 네트워크를 씁니다.
        NFCReaderUsageDescription: 접수대에서 듣는 분 안드로이드폰이 한 번에 방송 와이파이에 붙도록 엔에프시 스티커에 와이파이와 듣기 주소를 쓰는 데 씁니다.
        NSPhotoLibraryAddUsageDescription: 인쇄할 큐알코드 그림을 사진 앱에 저장하는 데 씁니다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    entitlements:
      path: Byod/ByodApp.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.ada.byod
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.5.0"   # 261018-BI7 LVD 방송 정리 — 현장 방송 시작(인터넷 방송도 함께, 셀룰러), 전화번호 칸, 인터넷 방송만 하기·TV해설방송 하기, 다시 듣기에 같은 행사 하나만(방클, 이사장님 승인 「1」). 261016-BI6 첫 화면에 라이브 현장영상해설 방송(인터넷)·현장영상해설교육 녹화(앱 안 화면·카메라 마이크·화면 꺼짐 막기, 방클, 이사장님 지시). 261015-BI5 이름을 LVD 송출로 바꿈(듣는 앱 LVD 방송과 나눔), 통화 중 듣는 분께 「잠시 기다려 주십시오」 안내(방송클, 이사장님 승인 「1」). 261014-BI4 행사 녹음과 결과보고를 배프 다시듣기에 올림, 행사 이름·현장영상해설사 칸, 지난 행사 기록(방송클, 이사장님 승인 「1」). 261014-BI3 플린트 2 방식 — 방송 서버를 공유기 안에 두고 이 아이폰은 해설 소리만 보냄, 와이파이 태그·큐알 한 장으로 듣기까지, 예비로 아이폰 서버 방식(방송클, 이사장님 승인 「1」). 261012-BI2 엔에프시 태그로 부름·듣기 주소 바로잡기와 확인·태그 쓴 뒤 다시 읽어 확인·A4 인쇄용 한 장(방송클, 이사장님 승인). 261010-BI1 아이폰 첫 판 — 방송·현장 점검·소리 크기·멈춘 폰 빼기·접속 도구(엔에프시·큐알)·기기 점검·도움말·새 판 알림(방송클, 이사장님 승인)
  AdaWatch:
